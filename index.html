:root{--bg:#0B0B0B;--bg2:#050505;--card:#161412;--card2:#1E1A16;--line:#3A342B;--line2:#241F19;--gold:#DDBF7E;--goldbg:#2A2216;--tx:#F3E9D2;--tx2:#E8DCC0;--mu:#A89F8E;--mu2:#8C8576;--red:#FF6B5E;--org:#F0A040;--grn:#4CC38A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg2);color:var(--tx);font-family:Tajawal,system-ui,sans-serif;font-size:15px}
body{min-height:100vh}
#app{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:90px}
button,input,select,textarea{font-family:inherit;font-size:15px;color:var(--tx)}
input,select,textarea{width:100%;height:46px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;outline:none}
textarea{height:auto;min-height:64px;padding:10px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
input::placeholder,textarea::placeholder{color:var(--mu2)}
select{padding-left:30px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:14px 20px,20px 20px;background-size:6px 6px;background-repeat:no-repeat}
.ltr{direction:ltr;unicode-bidi:embed;display:inline-block}
a{color:var(--gold)}
/* header */
.top{position:sticky;top:0;padding-top:max(12px,env(safe-area-inset-top));z-index:20;background:rgba(11,11,11,.96);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line2)}
.top .logo{direction:ltr;font-family:Cormorant,serif;font-size:30px;font-weight:700;color:var(--gold);line-height:1}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{color:var(--mu);font-size:12px}
.iconbtn{all:unset;cursor:pointer;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:12px;border:1px solid var(--line)}
.sync{all:unset;cursor:pointer;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--mu);white-space:nowrap}
.sync.ok{color:var(--grn);border-color:#1F4A33}.sync.wait{color:var(--org);border-color:#5A4220}.sync.off{color:var(--mu)}.sync.err{color:var(--red);border-color:#5a2420}
.preview{background:#2A2216;color:var(--gold);font-size:12px;text-align:center;padding:6px}
/* drawer */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(86vw,340px);background:#0F0E0C;z-index:41;overflow:auto;border-left:1px solid var(--line);padding:16px 12px 40px}
.drawer h4{margin:14px 6px 6px;color:var(--mu);font-size:12px;font-weight:700}
.mi{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;padding:11px 12px;border-radius:12px;font-size:15px}
.mi:hover,.mi.on{background:var(--goldbg);color:var(--gold)}
.mi .n{width:26px;color:var(--mu);font-size:12px}
/* layout */
.page{padding:14px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card.soft{background:transparent}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.lbl{font-size:12px;color:var(--mu);margin-bottom:4px;display:block}
.lbl i{color:var(--gold);font-style:normal}
.mut{color:var(--mu);font-size:13px}
.sm{font-size:12px}
.big{font-size:20px;font-weight:800}
.gold{color:var(--gold)}.red{color:var(--red)}.org{color:var(--org)}.grn{color:var(--grn)}
.sp{flex:1}
hr{border:none;border-top:1px solid var(--line2);margin:4px 0;width:100%}
/* chips / buttons */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;min-height:36px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx2);font-size:14px;font-weight:700;box-sizing:border-box}
.chip.on{border-color:var(--gold);background:var(--goldbg);color:var(--gold)}
.chip small{font-weight:400;color:var(--mu);margin-inline-start:4px}
.btn{all:unset;cursor:pointer;box-sizing:border-box;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:16px;background:var(--gold);color:#0B0B0B;padding:0 16px;text-align:center}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn.dark{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.btn.red{background:transparent;color:var(--red);border:1px solid #5a2420}
.btn.sm{height:38px;font-size:14px;border-radius:10px;padding:0 12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.mode{all:unset;cursor:pointer;text-align:center;border-radius:12px;padding:8px 4px;border:1px solid var(--line);background:var(--card)}
.mode div:first-child{font-size:11px;color:var(--mu)}
.mode div:last-child{font-size:16px;font-weight:800;color:var(--tx2)}
.mode.on{border-color:var(--gold);background:var(--goldbg)}
.mode.on div:first-child{color:var(--gold)}
/* search */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:48px}
.search input{border:none;background:transparent;height:44px;padding:0}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;max-height:340px;overflow-y:auto}
.li{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line2);width:100%;box-sizing:border-box}
.li:last-child{border-bottom:none}
.li b{font-size:15px}
.li span{font-size:12px;color:var(--mu);text-align:left}
/* calc table */
.tbl{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tr{display:grid;grid-template-columns:44px 1fr 1fr 1fr 46px 52px 78px;align-items:center;gap:2px;padding:7px 6px;border-bottom:1px solid var(--line2);font-size:13px;text-align:center}
.tr.h{background:#12100E;color:var(--mu);font-size:11px}
.tr.tot{background:var(--goldbg);font-weight:800}
.tr .p{display:flex;flex-direction:column;line-height:1.15}
.tr .p b{font-size:14px}
.tr .p small{font-size:10.5px}
.qty{display:flex;align-items:center;justify-content:center;gap:4px}
.qb{all:unset;cursor:pointer;width:24px;height:26px;border-radius:7px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:800}
.qty span{min-width:18px;font-weight:800}
/* misc */
.note{border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.note.warn{background:#231A0E;border:1px solid #5A4220;color:#F3D9A8}
.note.ok{background:#0F1E16;border:1px solid #1F4A33;color:#BDE8CF}
.note.bad{background:#2a1210;border:1px solid #5a2420;color:#FFC2BB}
.note.info{background:#141310;border:1px solid var(--line);color:var(--tx2)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0}
.kv span:first-child{color:var(--mu)}
.kv.tot{font-weight:800;font-size:16px;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--goldbg);color:var(--gold);white-space:nowrap}
.badge.g{background:#0F1E16;color:var(--grn)}.badge.r{background:#2a1210;color:var(--red)}.badge.o{background:#231A0E;color:var(--org)}.badge.m{background:#1b1915;color:var(--mu)}
.bar{height:8px;border-radius:6px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.line{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line2)}
.line:last-child{border-bottom:none}
.x{all:unset;cursor:pointer;color:var(--red);padding:4px 8px;font-size:18px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1E1A16;border:1px solid var(--gold);color:var(--tx);padding:12px 18px;border-radius:14px;z-index:60;max-width:90vw;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.fab{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:min(488px,calc(100vw - 32px));z-index:15}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;padding:9px 4px;border-radius:9px;font-weight:700;color:var(--tx2);font-size:14px}
.seg button.on{background:var(--gold);color:#0B0B0B}
details summary{cursor:pointer;color:var(--gold);font-weight:700}
/* invoice print */
#printArea{display:none}
@media print{
  body{background:#fff}
  #app,.toast,.dim,.drawer{display:none!important}
  #printArea{display:block}
}

</style>

'use strict';
const APP_VERSION = '1.0.0';
const $ = (s, el = document) => el.querySelector(s);
const esc = s => s == null ? '' : String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(',', '.')); return isNaN(n) ? null : n; };
const r2 = n => n == null || isNaN(n) ? '—' : (Math.round(n * 100) / 100).toLocaleString('en-US', { maximumFractionDigits: 2 });
const r0 = n => n == null || isNaN(n) ? '—' : Math.round(n).toLocaleString('en-US');
const money = n => n == null || isNaN(n) ? '—' : (Math.abs(n - Math.round(n)) < 0.005 ? r0(n) : (Math.round(n * 100) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const pct = (n, d = 0) => n == null || isNaN(n) ? '—' : (n * 100).toFixed(d) + '%';
const sgn = n => (n >= 0 ? '+' : '') + (n * 100).toFixed(0) + '%';
const pad = (n, w = 2) => String(n).padStart(w, '0');
const ymd = (d = new Date()) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const addDays = (s, k) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + k); return ymd(d); };
const dmy = s => s ? String(s).slice(0, 10).split('-').reverse().join('-') : '';
const norm = s => String(s || '').toLowerCase().replace(/[أإآا]/g, 'ا').replace(/[ىي]/g, 'ي').replace(/ة/g, 'ه').replace(/[ً-ْ]/g, '').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
const VALID = r => r && (r.Record_Status === 'Valid' || r.Record_Status === 'Edited');
const ACTIVE = r => r && (r.Status == null || r.Status === 'Active');

/* ---------------- tiny IndexedDB key-value ---------------- */
const KV = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const q = indexedDB.open('kandapp', 1);
      q.onupgradeneeded = () => q.result.createObjectStore('kv');
      q.onsuccess = () => { KV.db = q.result; res(); };
      q.onerror = () => rej(q.error);
    });
  },
  get(k) { return new Promise((res, rej) => { const t = KV.db.transaction('kv').objectStore('kv').get(k); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); }); },
  set(k, v) { return new Promise((res, rej) => { const t = KV.db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); t.onsuccess = () => res(); t.onerror = () => rej(t.error); }); }
};

/* ---------------- state ---------------- */
const S = {
  raw: null,          // {version, tables:{name:{h,r}}}
  T: {},              // tables as arrays of objects
  H: {},              // headers
  outbox: [],
  cfg: { device: 'W1', user: '', url: '', key: '', orderStart: 1, auto: true },
  lastSync: null, syncState: 'off', syncMsg: '', preview: false
};

function buildT() {
  S.T = {}; S.H = {};
  for (const [name, t] of Object.entries(S.raw.tables)) {
    S.H[name] = t.h;
    S.T[name] = t.r.map(r => { const o = {}; t.h.forEach((k, i) => o[k] = r[i] ?? null); return o; });
  }
  IDX.reset();
}
const T = n => S.T[n] || [];

/* indexes, rebuilt lazily */
const IDX = {
  c: {},
  reset() { this.c = {}; },
  by(table, key) {
    const k = table + '|' + key;
    if (!this.c[k]) { const m = new Map(); for (const r of T(table)) if (r[key] != null) m.set(String(r[key]), r); this.c[k] = m; }
    return this.c[k];
  }
};
const get = (table, key, val) => IDX.by(table, key).get(String(val));

async function saveLocal() {
  // serialise objects back to h/r arrays (keeps pending rows too)
  const tables = {};
  for (const [name, rows] of Object.entries(S.T)) { const h = S.H[name]; tables[name] = { h, r: rows.map(o => h.map(k => o[k] ?? null)) }; }
  S.raw = { version: S.raw.version, tables };
  await KV.set('data', S.raw); await KV.set('outbox', S.outbox); await KV.set('cfg', S.cfg); await KV.set('lastSync', S.lastSync);
}

/* ---------------- constants / settings ---------------- */
const C = key => { const r = get('Constants', 'Key', key); return r ? num(r.Value) ?? r.Value : null; };
const BI = key => { const r = get('Business_Info', 'Key', key); return r ? r.Value : ''; };

/* ---------------- IDs ---------------- */
function yymmdd(d = ymd()) { return d.slice(2, 4) + d.slice(5, 7) + d.slice(8, 10); }
function newId(prefix, table, date = ymd()) {
  const base = prefix + '-' + S.cfg.device + '-' + yymmdd(date) + '-';
  const key = S.H[table] ? S.H[table][0] : null;
  let mx = 0;
  for (const r of T(table)) { const v = String(r[key] || ''); if (v.startsWith(base)) mx = Math.max(mx, parseInt(v.slice(base.length)) || 0); }
  return base + pad(mx + 1);
}
function orderCodePrefix(date = ymd()) {
  const d = new Date(date + 'T00:00:00');
  const ml = (T('Month_Letters').find(r => +r.Month_No === d.getMonth() + 1) || {}).Letter || '?';
  const en = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][d.getDay()];
  const wl = (T('Weekday_Letters').find(r => r.Day_EN === en) || {}).Letter || en[0];
  return date.slice(2, 4) + ml + date.slice(8, 10) + wl;
}
function newOrderCode(date = ymd()) {
  const pre = orderCodePrefix(date) + '-', st = +S.cfg.orderStart || 1, end = st + 498;
  let mx = st - 1;
  for (const r of T('Orders')) { const c = String(r.Order_Code || ''); if (c.startsWith(pre)) { const n = parseInt(c.slice(pre.length)); if (n >= st && n <= end) mx = Math.max(mx, n); } }
  return pre + pad(mx + 1, 3);
}

/* ---------------- write ops (local first, then outbox) ---------------- */
function meta(row, date) {
  const now = ymd();
  if (S.H[row.__t]?.includes('Created_At') && !row.Created_At) row.Created_At = now;
  if (S.H[row.__t]?.includes('Updated_At')) row.Updated_At = now;
  if (S.H[row.__t]?.includes('Device')) row.Device = S.cfg.device;
}
function add(table, row) {
  if (!S.T[table]) { S.T[table] = []; S.H[table] = Object.keys(row); }
  row.__t = table; meta(row); delete row.__t;
  const h = S.H[table]; const clean = {}; h.forEach(k => clean[k] = row[k] ?? null);
  S.outbox.push({ opId: opId(), op: 'append', sheet: table, row: Object.assign({}, clean) });
  // keep computed helper fields locally (e.g. Total) even if the sheet computes them
  S.T[table].push(Object.assign(clean, row));
  IDX.reset();
  return clean;
}
function upd(table, id, fields, reason, match) {
  const key = S.H[table][0];
  const r = match ? T(table).find(x => Object.keys(match).every(k => String(x[k]) === String(match[k])))
                  : T(table).find(x => String(x[key]) === String(id));
  if (r) { Object.assign(r, fields); if ('Updated_At' in r) r.Updated_At = ymd(); }
  S.outbox.push({ opId: opId(), op: 'update', sheet: table, id, fields, reason: reason || '', match: match || null });
  IDX.reset();
  return r;
}
function opId() { return S.cfg.device + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7); }
async function commit(msg) {
  await saveLocal();
  if (msg) toast(msg);
  paintSync();
  if (S.cfg.auto) Sync.soon();
}

/* ---------------- sync ---------------- */
const Sync = {
  t: null, busy: false,
  soon() { clearTimeout(this.t); this.t = setTimeout(() => this.run(), 1500); },
  async call(method, payload) {
    if (!S.cfg.url) throw new Error('مفيش لينك مزامنة — حطه من الإعدادات');
    if (method === 'GET') {
      const u = S.cfg.url + (S.cfg.url.includes('?') ? '&' : '?') + new URLSearchParams(Object.assign({ key: S.cfg.key }, payload));
      const r = await fetch(u, { method: 'GET', redirect: 'follow' }); return r.json();
    }
    const r = await fetch(S.cfg.url, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ key: S.cfg.key, device: S.cfg.device }, payload)) });
    return r.json();
  },
  async run(force) {
    if (S.preview) { S.syncState = 'off'; S.syncMsg = 'نسخة تجربة — مفيش مزامنة'; paintSync(); return; }
    if (this.busy || !S.cfg.url) { paintSync(); return; }
    if (!navigator.onLine) { S.syncState = 'off'; paintSync(); return; }
    this.busy = true; S.syncState = 'busy'; paintSync();
    try {
      // 1) push in batches
      while (S.outbox.length) {
        const batch = S.outbox.slice(0, 40);
        const res = await this.call('POST', { ops: batch });
        if (!res || (!res.done && res.error)) throw new Error(res && res.error || 'no reply');
        const done = new Set(res.done || []);
        S.outbox = S.outbox.filter(o => !done.has(o.opId));
        await KV.set('outbox', S.outbox);
        if (res.failed && res.failed.length) { S.syncMsg = 'فيه ' + res.failed.length + ' تسجيل اترفض: ' + res.failed[0].error; break; }
      }
      // 2) pull fresh data
      if (!S.outbox.length || force) {
        const data = await this.call('GET', { action: 'pull' });
        if (!data.ok) throw new Error(data.error || 'pull failed');
        S.raw = { version: data.version, tables: data.tables };
        buildT();
        // re-apply anything still pending so the screen stays consistent
        for (const o of S.outbox) {
          if (o.op === 'append' && S.T[o.sheet]) S.T[o.sheet].push(Object.assign({}, o.row));
          if (o.op === 'update') { const key = S.H[o.sheet][0]; const r = T(o.sheet).find(x => o.match ? Object.keys(o.match).every(k => String(x[k]) === String(o.match[k])) : String(x[key]) === String(o.id)); if (r) Object.assign(r, o.fields); }
        }
        IDX.reset();
        S.lastSync = new Date().toISOString();
      }
      S.syncState = S.outbox.length ? 'err' : 'ok'; if (!S.outbox.length) S.syncMsg = '';
      await saveLocal();
      if (Router.cur && Router.cur.refreshOnSync !== false) Router.render(true);
    } catch (e) {
      S.syncState = navigator.onLine ? 'err' : 'off'; S.syncMsg = String(e.message || e);
    } finally { this.busy = false; paintSync(); }
  }
};
function paintSync() {
  const el = $('#syncBtn'); if (!el) return;
  const n = S.outbox.length;
  let cls = 'off', tx = 'أوفلاين';
  if (S.preview) { cls = 'off'; tx = 'تجربة'; }
  else if (!S.cfg.url) { cls = 'err'; tx = 'مش متوصل'; }
  else if (S.syncState === 'busy') { cls = 'wait'; tx = '⟳ مزامنة…'; }
  else if (n) { cls = navigator.onLine ? (S.syncState === 'err' ? 'err' : 'wait') : 'off'; tx = (navigator.onLine ? '' : 'أوفلاين · ') + n + ' مستني'; }
  else if (S.syncState === 'err') { cls = 'err'; tx = 'خطأ مزامنة'; }
  else if (navigator.onLine) { cls = 'ok'; tx = '✓ متزامن'; }
  el.className = 'sync ' + cls; el.textContent = tx; el.title = S.syncMsg || '';
}
window.addEventListener('online', () => { paintSync(); Sync.soon(); });
window.addEventListener('offline', paintSync);

/* ================= domain calculations ================= */
const K = {
  frag: id => get('Fragrances', 'Fragrance_ID', id),
  fname: id => { const f = K.frag(id); return f ? (f.Name_AR || f.Name_EN) : id; },
  sizes: () => T('Size_Defaults').map(r => +r.Size_ml).sort((a, b) => a - b),
  sp: v => get('Sales_Prices', 'Size_ml', v) || {},
  priceCol: cat => (get('Customer_Categories', 'Category', cat) || {}).Price_Column || 'Consumer_Price',
  price: (v, cat) => num(K.sp(v)[K.priceCol(cat)]),
  glass: v => num((get('Size_Defaults', 'Size_ml', v) || {}).Current_Glass_Price) ?? K.itemPrice((get('Size_Defaults', 'Size_ml', v) || {}).Default_Glass_Item_ID) ?? 0,
  itemPrice(id) {
    const xs = T('Item_Prices').filter(r => r.Item_ID === id && r.Status === 'Active').sort((a, b) => String(b.From_Date).localeCompare(String(a.From_Date)));
    return xs.length ? num(xs[0].Price) : null;
  },
  item: id => get('Items', 'Item_ID', id),
  itemName: id => { const i = K.item(id); return i ? i.Name_AR : id; },
  stats(fid) {
    const r = get('Price_Stats', 'Fragrance_ID', fid);
    if (r && num(r.Avg_per_g)) return { min: num(r.Min_per_g), med: num(r.Median_per_g), avg: num(r.Avg_per_g), max: num(r.Max_per_g), lines: num(r.Lines_Used) || 0 };
    const xs = T('List_Prices').filter(x => x.Fragrance_ID === fid && x.Include_In_Stats !== 'Inactive' && num(x.Price_per_g)).map(x => num(x.Price_per_g)).sort((a, b) => a - b);
    if (!xs.length) return null;
    const m = xs.length >> 1;
    return { min: xs[0], max: xs[xs.length - 1], avg: xs.reduce((a, b) => a + b, 0) / xs.length, med: xs.length % 2 ? xs[m] : (xs[m - 1] + xs[m]) / 2, lines: xs.length };
  },
  houseList(fid, house) {
    const xs = T('List_Prices').filter(x => x.Fragrance_ID === fid && x.House === house && num(x.Price_per_g)).map(x => num(x.Price_per_g)).sort((a, b) => a - b);
    return xs.length ? xs[xs.length >> 1] : null;
  },
  lastRec(table, fid) {
    const xs = T(table).filter(r => r.Fragrance_ID === fid && VALID(r));
    xs.sort((a, b) => String(a.Date).localeCompare(String(b.Date)) || String(a[S.H[table][0]]).localeCompare(String(b[S.H[table][0]])));
    return xs[xs.length - 1] || null;
  },
  lastBuy: fid => K.lastRec('Oil_Purchases', fid),
  lastQuote: fid => K.lastRec('Oil_Quotes', fid),
  conc(fid) {
    const f = K.frag(fid);
    if (f && num(f.Tested_Concentration)) return { c: num(f.Tested_Concentration), why: 'متجرب' };
    for (const t of ['Oil_Quotes', 'Oil_Purchases']) {
      const xs = T(t).filter(r => r.Fragrance_ID === fid && VALID(r) && num(r.Concentration)).sort((a, b) => String(a.Date).localeCompare(String(b.Date)));
      if (xs.length) return { c: num(xs[xs.length - 1].Concentration), why: 'آخر سجل' };
    }
    return { c: C('Default_Concentration') || 0.25, why: 'افتراضي' };
  },
  joker(fid) {
    const r = get('Joker_Summary_2026', 'Fragrance_ID', fid);
    const extra = T('Joker_Votes').filter(v => v.Fragrance_ID === fid && v.Source && String(v.Created_At || '') > '2026-11-18' && ACTIVE(v));
    const base = r ? ['Sug1', 'Sug2', 'Sug3', 'Sug4'].map(k => r[k]).filter(Boolean) : [];
    return base.concat(extra.map(v => (v.As_Written || v.House) + ' (' + (v.Votes || 1) + ')')).join(' · ');
  },
  /** stage-1 cost of one piece of size v (ml), price per g p, concentration c (fraction) */
  mix(c) {
    const od = C('Oil_Density') || 0.9414, ad = C('Alcohol_Density') || 0.808;
    const den = c / od + (1 - c) / ad;
    return { og: c / den, al: ((1 - c) / ad) / den };           // g oil per ml mix, ml alcohol per ml mix
  },
  unitCost(v, p, c) {
    const { og, al } = K.mix(c);
    const liquid = (p * og * v + (C('Alcohol_Price') || 160) * al * v / 1000) * (1 + (C('Liquid_Waste') ?? 0.1));
    const pack = K.glass(v) + (C('Label_Price') || 0) + (C('Logo_Price') || 0);
    return liquid + pack * (1 + (C('Pack_Waste') ?? 0.04)) + (C('Consumables_Fixed') || 0) + (C('Consumables_per_ml') || 0) * v;
  },
  marginColor(m) { return m < (C('Margin_Red_Below') ?? 0.15) ? 'var(--red)' : (m < (C('Margin_Green_Above') ?? 0.2) ? 'var(--org)' : 'var(--grn)'); },
  /** best price per gram for costing a fragrance: last purchase, else list average */
  costPrice(fid) { const b = K.lastBuy(fid); if (b && num(b.Price_per_unit)) return num(b.Price_per_unit); const s = K.stats(fid); return s ? s.avg : 0; },
  sku: (fid, v) => 'K-' + fid + '-' + pad(v, 3),
  product: sku => get('Products', 'SKU', sku),
  stock(code) { let s = 0; for (const r of T('Stock_Movements')) if (r.Stock_Code === code && VALID(r)) s += num(r.Qty) || 0; return Math.round(s * 10000) / 10000; },
  stockAll() {
    const m = new Map();
    for (const r of T('Stock_Movements')) {
      if (!VALID(r)) continue;
      const o = m.get(r.Stock_Code) || { code: r.Stock_Code, type: r.Stock_Type, unit: r.Unit, qty: 0, last: '' };
      o.qty += num(r.Qty) || 0; if (String(r.Date) > o.last) o.last = String(r.Date); m.set(r.Stock_Code, o);
    }
    return [...m.values()];
  },
  stockName(code, type) {
    if (code.startsWith('OIL-')) return 'زيت ' + K.fname(code.slice(4));
    const p = K.product(code); if (p) return p.Product_Name_AR || code;
    return K.itemName(code);
  },
  suppliers: (flag) => T('Suppliers').filter(s => ACTIVE(s) && (!flag || s[flag] === 'Applicable')),
  housesOf: sup => T('Supplier_House').filter(r => r.Supplier_AR === sup && ACTIVE(r)).map(r => r.House),
  suppliersOf: house => T('Supplier_House').filter(r => r.House === house && ACTIVE(r)).map(r => r.Supplier_AR),
  /** fragrance search */
  search(q, limit = 12) {
    const n = norm(q); const fr = T('Fragrances').filter(ACTIVE);
    if (!n) return fr.slice(0, limit);
    const sc = f => { const s = norm([f.Name_AR, f.Name_EN, f.Search_Aliases, f.Producer, f.Fragrance_ID].join(' ')); const i = s.indexOf(n); return i < 0 ? -1 : (norm(f.Name_AR).startsWith(n) || norm(f.Name_EN).startsWith(n) ? 0 : 1); };
    return fr.map(f => [sc(f), f]).filter(x => x[0] >= 0).sort((a, b) => a[0] - b[0]).map(x => x[1]).slice(0, limit);
  },
  gender: g => ({ Men: 'رجالي', Women: 'حريمي', Unisex: 'للجنسين' }[g] || g || ''),
  /* orders */
  linesOf: oid => T('Order_Lines').filter(l => l.Order_ID === oid),
  paysOf: oid => T('Payments').filter(p => p.Order_ID === oid),
  orderTotals(o) {
    const st = o.Record_Status;
    const lines = K.linesOf(o.Order_ID).filter(l => l.Record_Status === st);
    const sub = lines.reduce((a, l) => a + (num(l.Line_Total) ?? ((num(l.Qty) || 0) * (num(l.Unit_Price) || 0) - (num(l.Line_Discount) || 0))), 0);
    const refPct = num(o.Referral_Discount_Pct) || 0;
    const refD = o.Referral_Code_Used ? Math.round(sub * refPct * 100) / 100 : 0;
    const man = num(o.Manual_Discount) || 0, ship = num(o.Ship_Pack_Charged) || 0;
    const total = Math.round((sub - refD - man + ship) * 100) / 100;
    const paid = K.paysOf(o.Order_ID).filter(p => p.Status === 'Received' && p.Record_Status === st).reduce((a, p) => a + (num(p.Amount) || 0), 0);
    return { sub, refD, man, ship, total, paid, rem: Math.round((total - paid) * 100) / 100, lines };
  },
  statusAR: s => (get('Order_Statuses', 'Status_Code', s) || {}).Status_AR || s,
  statusOrder: s => num((get('Order_Statuses', 'Status_Code', s) || {}).Order) || 0,
  custByCode: code => T('Customers').find(c => c.Own_Referral_Code && String(c.Own_Referral_Code).toUpperCase() === String(code).toUpperCase()),
  points(cid, onDate = ymd()) {
    return T('Loyalty_Ledger').filter(l => l.Customer_ID === cid && VALID(l) && (!l.Expires_On || String(l.Expires_On) >= onDate || num(l.Points) < 0)).reduce((a, l) => a + (num(l.Points) || 0), 0);
  },
  zoneOf: gov => (get('Governorates', 'Governorate_AR', gov) || {}).Zone_ID,
  shipCharge(zone) { const z = get('Shipping_Zones', 'Zone_ID', zone); if (!z) return 0; return num(z.Ship_Pack_Override) ?? num(z.Ship_Pack_Charge) ?? Math.ceil((num(z.Courier_Price) || 0) + (num(z.Packing_Stage3) || 0)); },
  courierCost(service, zone) {
    const xs = T('Courier_Rates').filter(r => r.Service_ID === service && (r.Zone_ID === zone || !r.Zone_ID || r.Zone_ID === 'All') && ACTIVE(r)).sort((a, b) => String(b.From_Date).localeCompare(String(a.From_Date)));
    return xs.length ? num(xs[0].Price) : null;
  }
};

const ord = SCREENS.order = {
  title: 'أوردر جديد', sub: () => 'رقم الأوردر: ' + newOrderCode(ord.date || ymd()),
  init(p) {
    Object.assign(this, {
      date: ymd(), cid: p.cid || null, cq: '', copen: false, newCust: !p.cid,
      c: { Name: '', Phone: '', WhatsApp: '', Governorate: 'القاهرة', City_Area: '', Address: '', Landmark: '', Category: 'Consumer', Source_Channel: 'Instagram' },
      lines: [], q: '', open: false, pf: null, ptype: 'Product', kitId: '',
      delivery: 'Courier', service: '', shipOverride: '', tracking: '',
      pay: 'COD', refCode: '', manual: '', depAmt: '', depMethod: 'InstaPay', depRef: '', status: 'Confirmed', notes: ''
    });
  },
  cust() { return this.cid ? get('Customers', 'Customer_ID', this.cid) : null; },
  cat() { const c = this.cust(); return (c && !this.newCust ? c.Category : this.c.Category) || 'Consumer'; },
  gov() { const c = this.cust(); return (c && !this.newCust ? c.Governorate : this.c.Governorate); },
  pick(fid) { this.pf = fid; this.q = ''; this.open = false; Router.render(true); },
  addLine(v) {
    const fid = this.pf, sku = K.sku(fid, v), gift = this.ptype === 'Gift' || this.ptype === 'Sample';
    const price = gift ? (C('Gift_Unit_Price') ?? 0.01) : K.price(v, this.cat());
    if (price == null) return toast('مفيش سعر للحجم ده في Sales_Prices');
    const ex = this.lines.find(l => l.code === sku && l.type === this.ptype);
    if (ex) ex.qty++; else this.lines.push({ type: this.ptype, code: sku, fid, size: v, desc: K.fname(fid) + ' ' + v + ' مل', qty: 1, price });
    Router.render(true);
  },
  addKit() {
    const k = get('Kits', 'Kit_ID', this.kitId); if (!k) return;
    const cat = this.cat(), comps = T('Kit_Components').filter(x => x.Kit_ID === k.Kit_ID);
    let price;
    if (k.Price_Method === 'Fixed') price = num(k['Fixed_Price_' + cat]) ?? num(k.Fixed_Price_Consumer);
    if (price == null) price = comps.filter(x => x.Component_Type === 'Product').reduce((a, x) => { const p = K.product(x.Component_Code); return a + (num(x.Qty) || 0) * (p ? (K.price(+p.Size_ml, cat) || 0) : 0); }, 0);
    if (!price) return toast('سعر الكيت مش متحدد لفئة العميل دي');
    this.lines.push({ type: 'Kit', code: k.Kit_ID, size: num(k.Size_ml), desc: k.Kit_Name_AR, qty: 1, price });
    this.kitId = ''; Router.render(true);
  },
  totals() {
    const sub = this.lines.reduce((a, l) => a + l.qty * l.price, 0);
    const ref = this.refInfo(), refPct = ref.ok ? (C('Referral_Friend_Discount') ?? 0.1) : 0;
    const refD = Math.round(sub * refPct * 100) / 100, man = num(this.manual) || 0;
    const ship = this.ship(), total = Math.round((sub - refD - man + ship) * 100) / 100, dep = num(this.depAmt) || 0;
    return { sub, refPct, refD, man, ship, total, dep, rem: Math.round((total - dep) * 100) / 100 };
  },
  zone() { return K.zoneOf(this.gov()); },
  ship() {
    if (num(this.shipOverride) != null && this.shipOverride !== '') return num(this.shipOverride);
    if (this.delivery !== 'Courier') return 0;
    const sub = this.lines.reduce((a, l) => a + l.qty * l.price, 0);
    if (this.cat() !== 'Consumer' && sub >= (C('Free_Shipping_Threshold_Trader') || Infinity)) return 0;
    return K.shipCharge(this.zone());
  },
  refInfo() {
    const code = String(this.refCode || '').trim().toUpperCase(); if (!code) return { ok: false, msg: '' };
    const owner = K.custByCode(code) || (() => { const o = T('Orders').find(x => String(x.Order_Code).toUpperCase() === code && x.Record_Status !== 'Example'); return o && get('Customers', 'Customer_ID', o.Customer_ID); })();
    if (!owner) return { ok: false, msg: 'الكود ده مش موجود' };
    if (this.cid && owner.Customer_ID === this.cid) return { ok: false, msg: 'ده كود العميل نفسه' };
    if (this.cid && T('Orders').some(o => o.Customer_ID === this.cid && o.Status !== 'Cancelled' && o.Record_Status !== 'Example')) return { ok: false, msg: 'الخصم على أول طلب بس — العميل ده عنده طلبات قبل كده' };
    return { ok: true, owner, msg: 'كود ' + owner.Name + ' ✓' };
  },
  render() {
    const c = this.cust(), cat = this.cat(), z = this.zone();
    const custBlock = (!this.newCust && c) ? `<div class="row"><div class="sp"><b>${esc(c.Name)}</b><div class="mut sm"><span class="ltr">${esc(c.Phone || '')}</span> · ${esc(c.Governorate || '')} · ${esc(c.City_Area || '')}</div><div class="mut sm">${esc(c.Address || '')}</div></div>
        <span class="badge">${esc((get('Customer_Categories', 'Category', c.Category) || {}).Category_AR || c.Category)}</span><button class="chip" onclick="ord.cid=null;ord.newCust=true;Router.render(true)">تغيير</button></div>`
      : `<div class="search">${ICON.search}<input value="${esc(this.cq)}" placeholder="ابحث عن عميل قديم بالاسم أو الموبايل" oninput="ord.cq=this.value;ord.paintCust()"></div><div id="ord_cl"></div>
        <div class="mut sm">أو عميل جديد:</div>
        <div class="grid2">
          ${field('الاسم', `<input value="${esc(this.c.Name)}" oninput="ord.c.Name=this.value">`, true)}
          ${field('الموبايل', `<input type="tel" inputmode="tel" value="${esc(this.c.Phone)}" oninput="ord.c.Phone=this.value">`, true)}
          ${field('واتساب', `<input type="tel" inputmode="tel" value="${esc(this.c.WhatsApp)}" placeholder="نفس الموبايل" oninput="ord.c.WhatsApp=this.value">`)}
          ${field('المحافظة', `<select onchange="ord.c.Governorate=this.value;Router.render(true)">${T('Governorates').map(g => opt(g.Governorate_AR, g.Governorate_AR, this.c.Governorate)).join('')}</select>`)}
          ${field('المنطقة', `<input value="${esc(this.c.City_Area)}" oninput="ord.c.City_Area=this.value">`)}
          ${field('علامة مميزة', `<input value="${esc(this.c.Landmark)}" oninput="ord.c.Landmark=this.value">`)}
        </div>
        ${field('العنوان', `<input value="${esc(this.c.Address)}" placeholder="شارع، عمارة، دور، شقة" oninput="ord.c.Address=this.value">`)}
        <div class="grid2">
          ${field('فئة العميل', `<select onchange="ord.c.Category=this.value;ord.reprice()">${T('Customer_Categories').filter(ACTIVE).map(x => opt(x.Category, x.Category_AR, this.c.Category)).join('')}</select>`)}
          ${field('القناة', `<select onchange="ord.c.Source_Channel=this.value">${T('Sales_Channels').filter(ACTIVE).map(x => opt(x.Channel, x.Channel_AR, this.c.Source_Channel)).join('')}</select>`)}
        </div>`;
    const sizes = this.pf ? K.sizes() : [];
    const t = this.totals();
    const ri = this.refInfo();
    const minWarn = this.lines.filter(l => l.type === 'Product' && cat === 'Consumer' && (num(K.sp(l.size).Consumer_Min_Qty) || 1) > 1 && l.qty < num(K.sp(l.size).Consumer_Min_Qty));
    const svcs = T('Courier_Services').filter(ACTIVE);
    const svc = this.service || ((get('Shipping_Zones', 'Zone_ID', z) || {}).Default_Service_ID) || (svcs[0] || {}).Service_ID;
    return `
    <div class="card"><b class="gold">1 · العميل</b>${custBlock}</div>
    <div class="card"><b class="gold">2 · الأصناف <span class="mut sm">(سعر ${esc((get('Customer_Categories', 'Category', cat) || {}).Category_AR || cat)})</span></b>
      <div class="seg">${[['Product', 'منتج'], ['Gift', 'هدية'], ['Sample', 'عينة']].map(([k, l]) => `<button class="${this.ptype === k ? 'on' : ''}" onclick="ord.ptype='${k}';Router.render(true)">${l}</button>`).join('')}</div>
      ${this.ptype !== 'Product' ? `<div class="note info sm">الهدية / العينة منتج حقيقي بيخرج من المخزون وسعره ${C('Gift_Unit_Price') ?? 0.01} ج (مفيش كمية من غير سعر)</div>` : ''}
      ${Picker.html(this, 'ord', 'ابحث عن العطر وبعدين اختار الحجم')}
      ${this.pf ? `<div class="row"><b>${esc(K.fname(this.pf))}</b><span class="mut sm">اختار الحجم:</span></div><div class="chips">${sizes.map(v => { const s = K.stock(K.sku(this.pf, v)); return chip(false, v + ' مل<small>' + (this.ptype === 'Product' ? r0(K.price(v, cat)) + 'ج' : '') + ' · مخزون ' + r0(s) + '</small>', `ord.addLine(${v})`); }).join('')}</div>` : ''}
      ${T('Kits').filter(k => ACTIVE(k) && String(k.Customer_Categories || '').includes(cat)).length ? `<div class="row"><select onchange="ord.kitId=this.value"><option value="">أو كيت / دستة…</option>${T('Kits').filter(k => ACTIVE(k) && String(k.Customer_Categories || '').includes(cat)).map(k => opt(k.Kit_ID, k.Kit_Name_AR, this.kitId)).join('')}</select><button class="btn sm" onclick="ord.addKit()">إضافة</button></div>` : ''}
      ${this.lines.map((l, i) => `<div class="line"><div class="sp"><b>${esc(l.desc)}</b> ${l.type !== 'Product' ? `<span class="badge ${l.type === 'Gift' ? 'o' : 'm'}">${l.type === 'Gift' ? 'هدية' : l.type === 'Kit' ? 'كيت' : 'عينة'}</span>` : ''}<div class="mut sm">${money(l.price)} × ${l.qty} = ${money(l.price * l.qty)}</div></div>
        <span class="qty"><button class="qb" onclick="ord.lines[${i}].qty++;Router.render(true)">+</button><span>${l.qty}</span><button class="qb" onclick="ord.lines[${i}].qty=Math.max(1,ord.lines[${i}].qty-1);Router.render(true)">−</button></span><button class="x" onclick="ord.lines.splice(${i},1);Router.render(true)">×</button></div>`).join('') || '<div class="mut sm">لسه مفيش أصناف</div>'}
      ${minWarn.length ? `<div class="note warn sm">الحد الأدنى للمستهلك في ${minWarn.map(l => l.size + ' مل').join('، ')} هو ${K.sp(minWarn[0].size).Consumer_Min_Qty} قطع</div>` : ''}
    </div>
    <div class="card"><b class="gold">3 · التوصيل</b>
      <div class="seg">${T('Delivery_Methods').filter(ACTIVE).map(d => `<button class="${this.delivery === d.Method ? 'on' : ''}" onclick="ord.delivery='${d.Method}';Router.render(true)">${esc(d.Method_AR)}</button>`).join('')}</div>
      ${this.delivery === 'Courier' ? `<div class="grid2">${field('الخدمة', `<select onchange="ord.service=this.value">${svcs.map(s => opt(s.Service_ID, s.Service_AR, svc)).join('')}</select>`)}
        ${field('رقم الشحنة', `<input value="${esc(this.tracking)}" placeholder="بعدين" oninput="ord.tracking=this.value">`)}</div>
        <div class="mut sm">${esc(this.gov() || '')} ← ${esc((get('Shipping_Zones', 'Zone_ID', z) || {}).Zone_AR || 'منطقة غير محددة')} · شحن وتغليف ${money(K.shipCharge(z))} ج</div>` : ''}
      ${field('شحن وتغليف (لو عايز تغيّره)', `<input type="number" inputmode="decimal" value="${esc(this.shipOverride)}" placeholder="${money(this.ship())}" oninput="ord.shipOverride=this.value;ord.paintTot()">`)}
    </div>
    <div class="card"><b class="gold">4 · الدفع والخصم</b>
      <div class="grid2">
        ${field('طريقة الدفع', `<select onchange="ord.pay=this.value;Router.render(true)">${T('Payment_Methods').filter(ACTIVE).map(m => opt(m.Method, m.Method_AR, this.pay)).join('')}</select>`)}
        ${field('كود صاحبك', `<input class="ltr" style="text-transform:uppercase" value="${esc(this.refCode)}" placeholder="26N12T-003" oninput="ord.refCode=this.value;ord.paintTot()">`)}
      </div>
      <div id="ord_ref" class="sm"></div>
      <div class="grid2">
        ${field('خصم إضافي (ج)', `<input type="number" inputmode="decimal" value="${esc(this.manual)}" placeholder="0" oninput="ord.manual=this.value;ord.paintTot()">`)}
        ${field('حالة الأوردر', `<select onchange="ord.status=this.value">${T('Order_Statuses').filter(s => ['New', 'Confirmed', 'Prepared'].includes(s.Status_Code)).map(s => opt(s.Status_Code, s.Status_AR, this.status)).join('')}</select>`)}
      </div>
      ${this.pay !== 'COD' ? `<div class="grid3">
        ${field('مدفوع دلوقتي', `<input type="number" inputmode="decimal" value="${esc(this.depAmt)}" placeholder="${this.pay === 'Mixed' ? 'المقدم' : 'الإجمالي'}" oninput="ord.depAmt=this.value;ord.paintTot()">`)}
        ${field('بإيه', `<select onchange="ord.depMethod=this.value">${T('Payment_Methods').filter(m => ACTIVE(m) && !['COD', 'Mixed'].includes(m.Method)).map(m => opt(m.Method, m.Method_AR, this.pay === 'Mixed' ? this.depMethod : this.pay)).join('')}</select>`)}
        ${field('رقم العملية', `<input value="${esc(this.depRef)}" oninput="ord.depRef=this.value">`)}</div>` : ''}
      ${field('ملاحظات', `<input value="${esc(this.notes)}" oninput="ord.notes=this.value">`)}
    </div>
    <div class="card" id="ord_tot"></div>
    <button class="btn" onclick="ord.save()">حفظ الأوردر</button>`;
  },
  after() { this.paintTot(); if (this.newCust) this.paintCust(); },
  reprice() { const cat = this.cat(); this.lines.forEach(l => { if (l.type === 'Product') l.price = K.price(l.size, cat) ?? l.price; }); Router.render(true); },
  paintCust() {
    const el = $('#ord_cl'); if (!el) return; const n = norm(this.cq);
    if (!n) { el.innerHTML = ''; return; }
    const xs = T('Customers').filter(c => c.Status !== 'Inactive' && norm(c.Name + ' ' + c.Phone + ' ' + c.WhatsApp).includes(n)).slice(0, 8);
    el.innerHTML = `<div class="list">${xs.map(c => `<button class="li" onclick="ord.cid='${c.Customer_ID}';ord.newCust=false;ord.reprice()"><b>${esc(c.Name)}</b><span class="ltr">${esc(c.Phone || '')}</span></button>`).join('') || '<div class="li mut">مش موجود — كمّل كعميل جديد</div>'}</div>`;
  },
  paintTot() {
    const t = this.totals(), el = $('#ord_tot'), ri = this.refInfo(); if (!el) return;
    const r = $('#ord_ref'); if (r) r.innerHTML = ri.msg ? `<span class="${ri.ok ? 'grn' : 'red'}">${esc(ri.msg)}</span>` : '';
    const autoDep = this.pay !== 'COD' && this.pay !== 'Mixed' && this.depAmt === '' ? t.total : t.dep;
    el.innerHTML = `<div class="kv"><span>إجمالي الأصناف</span><span>${money(t.sub)}</span></div>
      ${t.refD ? `<div class="kv"><span>خصم كود صاحبك (${pct(t.refPct)})</span><span>− ${money(t.refD)}</span></div>` : ''}
      ${t.man ? `<div class="kv"><span>خصم إضافي</span><span>− ${money(t.man)}</span></div>` : ''}
      <div class="kv"><span>شحن وتغليف</span><span>${money(t.ship)}</span></div>
      <div class="kv tot"><span>الإجمالي المستحق</span><span class="gold">${money(t.total)} ج</span></div>
      <div class="kv"><span>مدفوع</span><span>${money(autoDep)}</span></div>
      <div class="kv"><span>${this.pay === 'COD' || this.pay === 'Mixed' ? 'المطلوب تحصيله عند الاستلام' : 'الباقي'}</span><b>${money(Math.round((t.total - autoDep) * 100) / 100)} ج</b></div>`;
  },
  async save() {
    if (!this.lines.length) return toast('ضيف صنف واحد على الأقل');
    let c = this.cust();
    if (this.newCust || !c) {
      if (!this.c.Name.trim() || !this.c.Phone.trim()) return toast('اكتب اسم العميل والموبايل');
      const dup = T('Customers').find(x => x.Phone && String(x.Phone).replace(/\D/g, '') === this.c.Phone.replace(/\D/g, ''));
      if (dup) { if (!(await ask('الموبايل ده مسجل باسم ' + dup.Name + ' — أستخدم نفس العميل؟'))) return; c = dup; }
      else c = add('Customers', Object.assign({ Customer_ID: newId('C', 'Customers'), WhatsApp: this.c.WhatsApp || this.c.Phone, Status: 'Active' }, this.c, { WhatsApp: this.c.WhatsApp || this.c.Phone }));
    }
    const date = this.date, oid = newId('OR', 'Orders', date), code = newOrderCode(date), t = this.totals(), ri = this.refInfo(), cat = c.Category || 'Consumer';
    const z = K.zoneOf(c.Governorate), svc = this.delivery === 'Courier' ? (this.service || (get('Shipping_Zones', 'Zone_ID', z) || {}).Default_Service_ID) : null;
    const isFirst = !c.Own_Referral_Code;
    const dep = this.pay === 'COD' ? 0 : (this.depAmt === '' && this.pay !== 'Mixed' ? t.total : (num(this.depAmt) || 0));
    const order = add('Orders', {
      Order_ID: oid, Order_Code: code, Order_Date: date, Customer_ID: c.Customer_ID, Customer_Name: c.Name, Phone: c.Phone, WhatsApp: c.WhatsApp, Governorate: c.Governorate, City_Area: c.City_Area, Address: c.Address, Landmark: c.Landmark,
      Customer_Category: cat, Channel: c.Source_Channel, Delivery_Method: this.delivery, Courier_Service: svc, Shipping_Zone: z, Tracking_No: this.tracking || null, Payment_Method: this.pay,
      Subtotal: t.sub, Referral_Code_Used: ri.ok ? this.refCode.trim().toUpperCase() : null, Referral_Discount_Pct: ri.ok ? t.refPct : null, Referral_Discount: t.refD, Manual_Discount: t.man, Discount: t.refD + t.man,
      Ship_Pack_Charged: t.ship, Total_Due: t.total, Paid: dep, Remaining: Math.round((t.total - dep) * 100) / 100, Courier_Cost_Actual: svc ? K.courierCost(svc, z) : null, COD_Fee: null,
      Customer_Referral_Code: c.Own_Referral_Code || code, Points_Balance_After: K.points(c.Customer_ID), Status: this.status, Status_Date: date, Record_Status: 'Valid', Notes: this.notes || null
    });
    for (const l of this.lines) {
      let cost = null;
      if (l.fid) { const pr = K.product(l.code); cost = Math.round(K.unitCost(l.size, K.costPrice(l.fid), num(pr && pr.Concentration) || K.conc(l.fid).c) * 100) / 100; }
      if (l.fid && !K.product(l.code)) add('Products', { SKU: l.code, Fragrance_ID: l.fid, Size_ml: l.size, Product_Name_AR: K.fname(l.fid) + ' ' + l.size + ' مل', Glass_Item_ID: (get('Size_Defaults', 'Size_ml', l.size) || {}).Default_Glass_Item_ID, Concentration: null, Stage: 'Testing', Status: 'Active', Notes: 'Created from order ' + code });
      add('Order_Lines', { Line_ID: newId('OL', 'Order_Lines', date), Order_ID: oid, Line_Type: l.type, SKU_or_Kit: l.code, Description: l.desc, Size_ml: l.size, Qty: l.qty, Unit_Price: l.price, Line_Discount: 0, Points_Earned: null, Line_Total: Math.round(l.qty * l.price * 100) / 100, Unit_Cost_Stage1: cost, Record_Status: 'Valid' });
    }
    // stage 2/3 order cost items
    const kitItems = this.lines.filter(l => l.type === 'Kit').flatMap(l => T('Kit_Components').filter(k => k.Kit_ID === l.code).map(k => k.Component_Code));
    const pieces = this.lines.reduce((a, l) => a + l.qty * (l.type === 'Kit' ? (num((get('Kits', 'Kit_ID', l.code) || {}).Pieces) || 1) : 1), 0);
    for (const oc of T('Order_Cost_Items').filter(x => x.Status === 'Active' && x[cat === 'Consumer' ? 'Consumer' : cat] === 'Applicable')) {
      if (oc.Calc_Basis === 'Pack') continue;
      if (oc.Item_ID === 'PR-UNICARD' && kitItems.includes('PR-UNICARD')) continue;
      if (oc.Calc_Basis === 'Order' && this.delivery !== 'Courier' && +oc.Stage === 3) continue;
      const q = oc.Calc_Basis === 'Piece' ? pieces : 1;
      add('Order_Costs', { Order_Cost_ID: newId('OC', 'Order_Costs', date), Order_ID: oid, Cost_Item_ID: oc.Cost_Item_ID, Qty: q, Unit_Cost: num(oc.Unit_Cost), Total: q * (num(oc.Unit_Cost) || 0), Record_Status: 'Valid' });
    }
    for (const l of this.lines.filter(l => l.type === 'Kit')) for (const k of T('Kit_Components').filter(x => x.Kit_ID === l.code && x.Component_Type === 'Item')) {
      const oc = T('Order_Cost_Items').find(x => x.Item_ID === k.Component_Code);
      if (oc) add('Order_Costs', { Order_Cost_ID: newId('OC', 'Order_Costs', date), Order_ID: oid, Cost_Item_ID: oc.Cost_Item_ID, Qty: l.qty * (num(k.Qty) || 1), Unit_Cost: num(oc.Unit_Cost), Total: l.qty * (num(k.Qty) || 1) * (num(oc.Unit_Cost) || 0), Record_Status: 'Valid' });
    }
    // payments
    if (dep > 0) add('Payments', { Payment_ID: newId('PY', 'Payments', date), Order_ID: oid, Date: date, Method: this.pay === 'Mixed' ? this.depMethod : this.pay, Amount: dep, Collected_By: 'Me', Reference: this.depRef || null, Status: 'Received', Notes: this.pay === 'Mixed' ? 'Deposit' : null, Record_Status: 'Valid' });
    const rem = Math.round((t.total - dep) * 100) / 100;
    if (rem > 0 && (this.pay === 'COD' || this.pay === 'Mixed')) add('Payments', { Payment_ID: newId('PY', 'Payments', date), Order_ID: oid, Date: null, Method: 'COD', Amount: rem, Collected_By: this.delivery === 'Courier' ? 'Courier' : 'Me', Reference: null, Status: 'Pending', Notes: 'Rest on delivery', Record_Status: 'Valid' });
    // customer: first order code = own referral code
    if (isFirst) upd('Customers', c.Customer_ID, { Own_Referral_Code: code, First_Order_ID: oid, Referred_By_Code: ri.ok ? this.refCode.trim().toUpperCase() : (c.Referred_By_Code || null), Referred_By_Customer_ID: ri.ok ? ri.owner.Customer_ID : (c.Referred_By_Customer_ID || null) }, 'First order');
    if (K.statusOrder(this.status) >= K.statusOrder('Prepared')) Orders.moveStock(order, 'out');
    await commit('اتسجل الأوردر ' + code + ' ✓');
    Router.go('orders', { id: oid });
  }
};

/* ================= 7.1 Orders list & detail ================= */
const Orders = SCREENS.orders = {
  title: 'الأوردرات والفواتير', sub: () => Orders.id ? '' : T('Orders').filter(o => o.Record_Status !== 'Example').length + ' أوردر',
  init(p) { this.id = p.id || null; this.q = this.q || ''; this.f = this.f || 'open'; this.payAmt = ''; this.payMethod = 'Cash'; this.payRef = ''; this.ret = null; },
  render() { return this.id ? this.detail() : this.list(); },
  list() {
    const fl = [['open', 'مفتوحة'], ['due', 'عليها فلوس'], ['all', 'الكل']];
    return `<div class="search">${ICON.search}<input value="${esc(this.q)}" placeholder="رقم الأوردر / الاسم / الموبايل" oninput="Orders.q=this.value;Orders.paintList()"></div>
      <div class="seg">${fl.map(([k, l]) => `<button class="${this.f === k ? 'on' : ''}" onclick="Orders.f='${k}';Router.render(true)">${l}</button>`).join('')}</div>
      <div id="ord_list"></div><div class="fab"><button class="btn" onclick="Router.go('order')">+ أوردر جديد</button></div>`;
  },
  after() { if (!this.id) this.paintList(); },
  paintList() {
    const n = norm(this.q);
    let xs = T('Orders').filter(o => o.Record_Status !== 'Cancelled');
    if (n) xs = xs.filter(o => norm([o.Order_Code, o.Customer_Name, o.Phone, o.WhatsApp].join(' ')).includes(n));
    xs = xs.map(o => ({ o, t: K.orderTotals(o) }));
    if (this.f === 'open') xs = xs.filter(x => !['Delivered', 'Cancelled', 'Returned'].includes(x.o.Status) || x.t.rem > 0.009);
    if (this.f === 'due') xs = xs.filter(x => x.t.rem > 0.009 && x.o.Status !== 'Cancelled');
    xs.sort((a, b) => String(b.o.Order_Date).localeCompare(String(a.o.Order_Date)) || String(b.o.Order_Code).localeCompare(String(a.o.Order_Code)));
    $('#ord_list').innerHTML = xs.length ? xs.map(({ o, t }) => `<button class="card" style="all:unset;cursor:pointer;display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px" onclick="Router.go('orders',{id:'${o.Order_ID}'})">
      <div class="row"><b class="ltr gold">${esc(o.Order_Code)}</b><span class="sp"></span>${Orders.badge(o.Status)}${o.Record_Status === 'Example' ? '<span class="badge m">مثال</span>' : ''}</div>

    <div class="card"><div class="row"><b class="big ltr gold">${esc(o.Order_Code)}</b><span class="sp"></span>${this.badge(o.Status)}</div>
      <div class="mut sm">${dmy(o.Order_Date)} · ${esc((get('Customer_Categories', 'Category', o.Customer_Category) || {}).Category_AR || '')} · ${esc(o.Channel || '')}</div>
      <hr><b>${esc(o.Customer_Name)}</b><div class="sm"><a class="ltr" href="tel:${esc(o.Phone)}">${esc(o.Phone || '')}</a>${wa ? ` · <a href="https://wa.me/${wa}" target="_blank">واتساب</a>` : ''}</div>
      <div class="sm">${esc([o.Governorate, o.City_Area, o.Address].filter(Boolean).join(' — '))}${o.Landmark ? ' · ' + esc(o.Landmark) : ''}</div>
      <div class="mut sm">${esc((get('Delivery_Methods', 'Method', o.Delivery_Method) || {}).Method_AR || '')}${svc ? ' — ' + esc(svc.Service_AR) : ''}${o.Tracking_No ? ' · شحنة <span class="ltr">' + esc(o.Tracking_No) + '</span>' : ''}</div></div>

      <hr><div class="kv"><span>إجمالي الأصناف</span><span>${money(t.sub)}</span></div>${t.refD ? `<div class="kv"><span>خصم كود صاحبك (${pct(num(o.Referral_Discount_Pct))})</span><span>− ${money(t.refD)}</span></div>` : ''}${t.man ? `<div class="kv"><span>خصم إضافي</span><span>− ${money(t.man)}</span></div>` : ''}
      <div class="kv"><span>شحن وتغليف</span><span>${money(t.ship)}</span></div><div class="kv tot"><span>الإجمالي</span><span>${money(t.total)} ج</span></div>
      <div class="kv"><span>مدفوع</span><span class="grn">${money(t.paid)}</span></div><div class="kv"><span>الباقي</span><b class="${t.rem > 0.009 ? 'org' : 'grn'}">${money(t.rem)} ج</b></div></div>
    <div class="grid2"><button class="btn" onclick="Invoice.print('${o.Order_ID}')">فاتورة PDF</button><a class="btn ghost" href="${esc(Invoice.waLink(o.Order_ID))}" target="_blank" rel="noopener">ابعت ملخص واتساب</a></div>
    <div class="card"><b class="gold">الحالة</b><div class="chips">${sts.map(s => chip(o.Status === s.Status_Code, esc(s.Status_AR), `Orders.setStatus('${o.Order_ID}','${s.Status_Code}')`)).join('')}</div>
      ${field('رقم الشحنة', `<div class="row"><input value="${esc(o.Tracking_No || '')}" id="trk"><button class="btn sm" onclick="Orders.setTrack('${o.Order_ID}')">حفظ</button></div>`)}</div>
    <div class="card"><b class="gold">المدفوعات</b>${pays.map(p => `<div class="kv"><span>${p.Date ? dmy(p.Date) : '—'} · ${esc((get('Payment_Methods', 'Method', p.Method) || {}).Method_AR || p.Method)} ${p.Reference ? '· <span class="ltr">' + esc(p.Reference) + '</span>' : ''}</span><span>${money(num(p.Amount))} <span class="badge ${p.Status === 'Received' ? 'g' : p.Status === 'Refunded' ? 'r' : 'o'}">${p.Status === 'Received' ? 'اتحصل' : p.Status === 'Refunded' ? 'مرتجع' : 'مستني'}</span>${p.Status === 'Pending' ? ` <button class="chip" onclick="Orders.collect('${p.Payment_ID}')">اتحصل</button>` : ''}</span></div>`).join('') || '<div class="mut sm">مفيش</div>'}
      <div class="grid3">${field('مبلغ', `<input type="number" inputmode="decimal" value="${esc(this.payAmt)}" placeholder="${money(t.rem)}" oninput="Orders.payAmt=this.value">`)}${field('بإيه', `<select onchange="Orders.payMethod=this.value">${T('Payment_Methods').filter(m => ACTIVE(m) && m.Method !== 'Mixed').map(m => opt(m.Method, m.Method_AR, this.payMethod)).join('')}</select>`)}${field('مرجع', `<input value="${esc(this.payRef)}" oninput="Orders.payRef=this.value">`)}</div>

    <details class="card"><summary>مرتجع</summary>
      ${field('الصنف', `<select id="rt_line">${t.lines.filter(l => l.Line_Type !== 'Kit').map(l => opt(l.Line_ID, l.Description + ' × ' + l.Qty, '')).join('')}</select>`)}
      <div class="grid3">${field('الكمية', '<input id="rt_qty" type="number" value="1">')}${field('الحالة', `<select id="rt_cond">${opt('Resellable', 'ينفع يتباع تاني')}${opt('Damaged', 'تالف')}</select>`)}${field('فلوس راجعة', '<input id="rt_ref" type="number" inputmode="decimal" placeholder="0">')}</div>
      ${field('السبب', '<input id="rt_why">')}<button class="btn sm red" onclick="Orders.addReturn('${o.Order_ID}')">تسجيل المرتجع</button></details>
    ${o.Notes ? `<div class="note info sm">${esc(o.Notes)}</div>` : ''}`;
  },
  moveStock(o, dir) {
    const lines = K.linesOf(o.Order_ID).filter(l => l.Record_Status === o.Record_Status), date = ymd(), sign = dir === 'out' ? -1 : 1;
    const mt = l => dir === 'out' ? ({ Gift: 'Gift Out', Sample: 'Sample Out' }[l.Line_Type] || 'Sale Out') : 'Adjustment';
    const mv = (code, type, qty, unit, l, note) => add('Stock_Movements', { Move_ID: newId('SM', 'Stock_Movements', date), Date: date, Stock_Code: code, Stock_Type: type, Movement_Type: mt(l), Qty: sign * qty, Unit: unit, Ref_Doc: o.Order_ID, Location: 'L01', Record_Status: 'Valid', Notes: note || o.Order_Code });
    for (const l of lines) {
      if (l.Line_Type === 'Kit') {
        for (const k of T('Kit_Components').filter(x => x.Kit_ID === l.SKU_or_Kit)) mv(k.Component_Code, k.Component_Type === 'Product' ? 'Product' : 'Item', (num(k.Qty) || 1) * (num(l.Qty) || 1), 'piece', l, o.Order_Code + ' · ' + l.SKU_or_Kit);
      } else mv(l.SKU_or_Kit, 'Product', num(l.Qty) || 0, 'piece', l);
    }
  },
  async setStatus(oid, s) {
    const o = get('Orders', 'Order_ID', oid); if (!o || o.Status === s) return;
    const was = K.statusOrder(o.Status), now = K.statusOrder(s), P = K.statusOrder('Prepared');
    const moved = T('Stock_Movements').some(m => m.Ref_Doc === oid && VALID(m) && String(m.Movement_Type).endsWith('Out'));
    if (s === 'Cancelled' && moved && !(await ask('الأوردر خرج من المخزون — أرجّع البضاعة للمخزون وألغي الأوردر؟'))) return;
    if (s === 'Cancelled' && moved) this.moveStock(o, 'in');
    else if (now >= P && s !== 'Returned' && s !== 'Cancelled' && !moved) this.moveStock(o, 'out');
    const f = { Status: s, Status_Date: ymd() }; if (s === 'Delivered') f.Delivered_Date = ymd();
    upd('Orders', oid, f, 'Status ' + o.Status + ' → ' + s);
    if (s === 'Delivered') {
      const pend = K.paysOf(oid).filter(p => p.Status === 'Pending' && VALID(p));
      if (pend.length && await ask('اتحصل باقي الفلوس (' + money(pend.reduce((a, p) => a + (num(p.Amount) || 0), 0)) + ' ج)؟')) pend.forEach(p => upd('Payments', p.Payment_ID, { Status: 'Received', Date: ymd() }, 'Collected on delivery'));
      if (o.Referral_Code_Used) {
        const owner = K.custByCode(o.Referral_Code_Used);
        const already = T('Loyalty_Ledger').some(l => l.Ref_Order === oid && l.Rule_ID === 'LR5');
        if (owner && !already) add('Loyalty_Ledger', { Entry_ID: newId('LL', 'Loyalty_Ledger'), Date: ymd(), Customer_ID: owner.Customer_ID, Rule_ID: 'LR5', Points: C('Referral_Points') ?? 3, Ref_Order: oid, Expires_On: addDays(ymd(), C('Points_Validity_Days') || 60), Record_Status: 'Valid', Notes: 'Referral: ' + o.Order_Code });
      }
    }
    await commit('الحالة: ' + K.statusAR(s));
    Router.render(true);
  },
  async setTrack(oid) { upd('Orders', oid, { Tracking_No: $('#trk').value.trim() }, 'Tracking'); await commit('اتحفظ رقم الشحنة'); Router.render(true); },
  async collect(pid) { upd('Payments', pid, { Status: 'Received', Date: ymd() }, 'Collected'); await commit('اتسجل التحصيل ✓'); Router.render(true); },
  async addPay(oid) {
    const o = get('Orders', 'Order_ID', oid), t = K.orderTotals(o), a = num(this.payAmt) ?? t.rem;
    if (!(a > 0)) return toast('اكتب المبلغ');
    add('Payments', { Payment_ID: newId('PY', 'Payments'), Order_ID: oid, Date: ymd(), Method: this.payMethod, Amount: a, Collected_By: this.payMethod === 'COD' ? 'Courier' : 'Me', Reference: this.payRef || null, Status: 'Received', Notes: null, Record_Status: o.Record_Status === 'Example' ? 'Example' : 'Valid' });
    // close a pending COD row if this covers it
    const pend = K.paysOf(oid).filter(p => p.Status === 'Pending' && VALID(p));
    if (pend.length && a >= t.rem - 0.009) pend.forEach(p => upd('Payments', p.Payment_ID, { Record_Status: 'Cancelled', Notes: 'Replaced by payment ' + ymd() }, 'Paid by another method'));
    this.payAmt = ''; this.payRef = '';
    await commit('اتسجلت الدفعة ✓'); Router.render(true);
  },
  async addReturn(oid) {
    const o = get('Orders', 'Order_ID', oid), lid = $('#rt_line').value, l = get('Order_Lines', 'Line_ID', lid);
    const q = num($('#rt_qty').value) || 1, cond = $('#rt_cond').value, ref = num($('#rt_ref').value) || 0;
    if (!l) return;
    const rid = newId('RT', 'Returns');
    add('Returns', { Return_ID: rid, Order_ID: oid, Line_ID: lid, SKU: l.SKU_or_Kit, Qty: q, Reason: $('#rt_why').value || null, Condition: cond, Refund_Amount: ref, Date: ymd(), Record_Status: 'Valid' });
    if (cond === 'Resellable') add('Stock_Movements', { Move_ID: newId('SM', 'Stock_Movements'), Date: ymd(), Stock_Code: l.SKU_or_Kit, Stock_Type: 'Product', Movement_Type: 'Return In', Qty: q, Unit: 'piece', Ref_Doc: rid, Location: 'L01', Record_Status: 'Valid', Notes: o.Order_Code });
    if (ref > 0) add('Payments', { Payment_ID: newId('PY', 'Payments'), Order_ID: oid, Date: ymd(), Method: 'Cash', Amount: -ref, Collected_By: 'Me', Reference: rid, Status: 'Refunded', Notes: 'Refund', Record_Status: 'Valid' });
    await commit('اتسجل المرتجع ✓'); Router.render(true);
  }
};

      ${field('القناة', `<select onchange="Cust.edit.Source_Channel=this.value">${T('Sales_Channels').map(x => opt(x.Channel, x.Channel_AR, c.Source_Channel)).join('')}</select>`)}

/* Screens: other purchase · production batch · stock · expenses · joker · reports · settings */
'use strict';
const ITEM_TYPE = { Glass: 'Glass', Alcohol: 'Alcohol', Label: 'Labels & printing', Print: 'Print', Packaging: 'Packaging', Shipping: 'Shipping', Tools: 'Tools' };
const stockQty = (it, qty, unit) => unit === 'dozen' ? qty * (num(it && it.Pieces_per_Unit) || 12) : qty;
const stockUnit = (it, unit) => unit === 'dozen' ? 'piece' : unit;

/* ================= 5. Other purchase ================= */
const pur = SCREENS.purchase = {
  title: 'شراء مستلزمات', sub: () => 'زجاج · كحول · ليبل · تغليف · شحن · أدوات',
  init() { Object.assign(this, { cat: 'Glass', item: '', sup: '', qty: '', unit: '', ppu: '', price: '', pay: 'Cash', paid: '', notes: '', date: ymd() }); },
  render() {
    const cats = [...new Set(T('Items').filter(ACTIVE).map(i => i.Category))];
    const items = T('Items').filter(i => ACTIVE(i) && i.Category === this.cat);
    const it = K.item(this.item);
    const sups = K.suppliers().map(s => s.Supplier_AR);
    const cur = it ? K.itemPrice(it.Item_ID) : null;
    return `<div class="chips">${cats.map(c => chip(this.cat === c, esc(c), `pur.cat='${c}';pur.item='';Router.render(true)`)).join('')}</div>
    <div class="card">${field('الصنف', `<select onchange="pur.setItem(this.value)"><option value="">اختار…</option>${items.map(i => opt(i.Item_ID, i.Name_AR, this.item)).join('')}</select>`, true)}
      ${it ? `<div class="mut sm">${esc(it.Item_ID)} · الوحدة ${esc(it.Unit)}${num(it.Pieces_per_Unit) > 1 ? ' (' + it.Pieces_per_Unit + ' قطعة)' : ''} · مخزون ${r2(K.stock(it.Item_ID))} · السعر الحالي ${cur != null ? r2(cur) : '—'}</div>` : ''}
      <div class="lbl">المورد</div><div class="chips">${sups.map(s => chip(this.sup === s, esc(s), `pur.sup=pur.sup===${qa(s)}?'':${qa(s)};Router.render(true)`)).join('')}</div>
      <div class="grid3">${field('الكمية', `<input type="number" inputmode="decimal" value="${esc(this.qty)}" oninput="pur.qty=this.value;pur.paint()">`, true)}
        ${field('الوحدة', `<select onchange="pur.unit=this.value;pur.paint()">${['piece', 'dozen', 'sheet', 'L', 'roll', 'kg', 'g'].map(u => opt(u, { piece: 'قطعة', dozen: 'دستة', sheet: 'شيت', L: 'لتر', roll: 'رول', kg: 'كيلو', g: 'جرام' }[u], this.unit)).join('')}</select>`)}
        ${field('سعر الوحدة', `<input type="number" inputmode="decimal" value="${esc(this.price)}" oninput="pur.price=this.value;pur.paint()">`, true)}</div>
      <div class="grid3">${field('طريقة الدفع', `<select onchange="pur.pay=this.value">${T('Payment_Methods').filter(ACTIVE).map(m => opt(m.Method, m.Method_AR, this.pay)).join('')}</select>`)}
        ${field('المدفوع', `<input type="number" inputmode="decimal" value="${esc(this.paid)}" placeholder="= الإجمالي" oninput="pur.paid=this.value">`)}
        ${field('التاريخ', `<input type="date" value="${this.date}" onchange="pur.date=this.value">`)}</div>
      ${field('ملاحظات', `<input value="${esc(this.notes)}" oninput="pur.notes=this.value">`)}
      <div id="pur_tot" class="gold" style="font-weight:800"></div></div>
    <button class="btn" onclick="pur.save()">حفظ الشراء</button>`;
  },
  after() { this.paint(); },
  setItem(id) { this.item = id; const it = K.item(id); if (it) { this.unit = it.Unit || 'piece'; if (!this.sup && it.Default_Supplier && it.Default_Supplier !== 'غير مسجل') this.sup = it.Default_Supplier; } Router.render(true); },
  paint() {
    const it = K.item(this.item), q = num(this.qty), p = num(this.price), el = $('#pur_tot'); if (!el) return;
    if (!it || !q || !p) { el.textContent = ''; return; }
    const sq = stockQty(it, q, this.unit), ppp = this.unit === 'dozen' ? p / (num(it.Pieces_per_Unit) || 12) : p;
    el.innerHTML = `الإجمالي ${money(q * p)} ج · يدخل المخزون ${r2(sq)} ${stockUnit(it, this.unit) === 'piece' ? 'قطعة' : stockUnit(it, this.unit)} · ${r2(ppp)} ج للوحدة`;
  },
  async save() {
    const it = K.item(this.item), q = num(this.qty), p = num(this.price);
    if (!it || !(q > 0) || !(p >= 0) || this.price === '') return toast('اختار الصنف واكتب الكمية والسعر');
    const date = this.date, id = newId('XP', 'Other_Purchases', date), ppu = this.unit === 'dozen' ? (num(it.Pieces_per_Unit) || 12) : 1;
    const ppp = p / ppu, tot = Math.round(q * p * 100) / 100;
    add('Other_Purchases', { Purchase_ID: id, Date: date, Item_Type: ITEM_TYPE[it.Category] || it.Category, Item_ID: it.Item_ID, Item: it.Name_AR, Supplier: this.sup || null, Qty: q, Unit: this.unit, Pieces_per_Unit: ppu, Unit_Price: p, Total: tot, Price_per_Piece: Math.round(ppp * 10000) / 10000, Record_Status: 'Valid', Notes: this.notes || null, Payment_Method: this.pay, Amount_Paid: num(this.paid) ?? tot });
    if (it.Stock_Tracked !== 'Not applicable') add('Stock_Movements', { Move_ID: newId('SM', 'Stock_Movements', date), Date: date, Stock_Code: it.Item_ID, Stock_Type: 'Item', Movement_Type: 'Purchase In', Qty: stockQty(it, q, this.unit), Unit: stockUnit(it, this.unit), Ref_Doc: id, Location: 'L01', Record_Status: 'Valid', Notes: it.Name_AR });
    // price list: new Active price if it changed (old one → Inactive)
    const per = stockUnit(it, this.unit), cur = T('Item_Prices').find(r => r.Item_ID === it.Item_ID && r.Status === 'Active');
    if (!cur || Math.abs((num(cur.Price) || 0) - ppp) > 0.0001) {
      if (cur) upd('Item_Prices', null, { Status: 'Inactive' }, 'New purchase price', { Item_ID: it.Item_ID, Status: 'Active' });
      add('Item_Prices', { Item_ID: it.Item_ID, Price: Math.round(ppp * 10000) / 10000, Per: per, Price_Type: 'Purchase', From_Date: date, Supplier: this.sup || null, Notes: q + ' ' + this.unit + ' × ' + p, Status: 'Active' });
    }
    await commit('اتسجل الشراء ودخل المخزون ✓'); this.init(); Router.render(true);
  }
};

/* ================= 6. Production batch ================= */
const bat = SCREENS.batch = {
  title: 'تشغيلة / تعبئة', sub: () => 'الزيت + الكحول + الزجاج → منتجات في المخزون',
  init(p) { Object.assign(this, { fid: p.fid || null, q: '', open: !p.fid, lot: '', conc: '', plan: {}, oilAct: '', alcAct: '', waste: '', days: 14, logo: K.stock('PR-LOGO') > 0, notes: '', date: ymd() }); },
  pick(fid) { this.fid = fid; this.q = ''; this.open = false; this.lot = ''; Router.render(true); },
  c() { const v = num(this.conc); if (v > 0) return v / 100; const lot = get('Oil_Purchases', 'Purchase_ID', this.lot); if (lot && num(lot.Concentration)) return num(lot.Concentration); return K.conc(this.fid).c; },
  calcs() {
    const c = this.c(), { og, al } = K.mix(c); let ml = 0, pcs = 0; const need = {};
    for (const [v, n] of Object.entries(this.plan)) { if (!(n > 0)) continue; ml += v * n; pcs += n; const g = (get('Size_Defaults', 'Size_ml', v) || {}).Default_Glass_Item_ID; if (g) need[g] = (need[g] || 0) + n; }
    const oil = ml * og, alcMl = ml * al;
    return { c, ml, pcs, oil, alcMl, alcG: alcMl * (C('Alcohol_Density') || 0.808), need };
  },
  render() {
    const f = this.fid && K.frag(this.fid);
    if (!f) return Picker.html(this, 'bat');
    const lots = T('Oil_Purchases').filter(r => r.Fragrance_ID === this.fid && VALID(r));
    return `<div class="card"><div class="row"><b class="big sp">${esc(f.Name_AR)}</b><button class="chip" onclick="bat.fid=null;bat.open=true;Router.render(true)">تغيير</button></div>
      <div class="mut sm">مخزون الزيت: ${r2(K.stock('OIL-' + this.fid))} جم</div>
      ${field('من أنهي شراء (اللوت)', `<select onchange="bat.lot=this.value;Router.render(true)"><option value="">—</option>${lots.map(l => opt(l.Purchase_ID, dmy(l.Date) + ' · ' + (l.Supplier || '—') + ' · ' + (l.House || '—') + ' · ' + r2(num(l.Price_per_unit)) + ' ج/جم', this.lot)).join('')}</select>`)}
      <div class="grid2">${field('التركيز % (بالوزن)', `<input type="number" inputmode="decimal" value="${esc(this.conc)}" placeholder="${Math.round(this.c() * 100)}" oninput="bat.conc=this.value;bat.paint()">`)}
      ${field('التاريخ', `<input type="date" value="${this.date}" onchange="bat.date=this.value">`)}</div></div>
    <div class="card"><b class="gold">هتعبّي كام؟</b>${K.sizes().map(v => `<div class="row"><span style="width:60px"><b>${v}</b> مل</span><span class="mut sm sp">زجاج ${esc((get('Size_Defaults', 'Size_ml', v) || {}).Default_Glass_Item_ID || '')} · مخزون ${r0(K.stock((get('Size_Defaults', 'Size_ml', v) || {}).Default_Glass_Item_ID))}</span>
      <span class="qty"><button class="qb" onclick="bat.q2(${v},1)">+</button><span>${this.plan[v] || 0}</span><button class="qb" onclick="bat.q2(${v},-1)">−</button></span></div>`).join('')}</div>
    <div class="card" id="bat_calc"></div>
    <div class="card"><div class="grid3">${field('زيت فعلي جم', `<input type="number" inputmode="decimal" value="${esc(this.oilAct)}" oninput="bat.oilAct=this.value">`)}${field('كحول فعلي جم', `<input type="number" inputmode="decimal" value="${esc(this.alcAct)}" oninput="bat.alcAct=this.value">`)}${field('هالك جم', `<input type="number" inputmode="decimal" value="${esc(this.waste)}" oninput="bat.waste=this.value">`)}</div>
      <div class="grid2">${field('أيام التعتيق', `<input type="number" value="${this.days}" oninput="bat.days=this.value">`)}<label class="row sm" style="margin-top:22px"><input type="checkbox" style="width:22px;height:22px" ${this.logo ? 'checked' : ''} onchange="bat.logo=this.checked"> حطيت اللوجو</label></div>
      ${field('ملاحظات', `<input value="${esc(this.notes)}" oninput="bat.notes=this.value">`)}</div>
    <button class="btn" onclick="bat.save()">حفظ التشغيلة</button>`;
  },
  after() { if (this.fid) this.paint(); },
  q2(v, d) { this.plan[v] = Math.max(0, (this.plan[v] || 0) + d); Router.render(true); },
  paint() {
    const el = $('#bat_calc'); if (!el) return; const x = this.calcs();
    if (!x.pcs) { el.innerHTML = '<div class="mut">زوّد الكميات فوق</div>'; return; }
    const warn = [];
    if (x.oil > K.stock('OIL-' + this.fid) + 0.001) warn.push('الزيت مش كفاية (محتاج ' + r2(x.oil) + ' جم)');
    if (x.alcMl / 1000 > K.stock('AL-ETH96') + 0.0001) warn.push('الكحول مش كفاية');
    for (const [g, n] of Object.entries(x.need)) if (n > K.stock(g)) warn.push(K.itemName(g) + ': محتاج ' + n + ' والمخزون ' + r0(K.stock(g)));
    if (x.pcs / 72 > K.stock('LB-800837')) warn.push('الليبل مش كفاية');
    const lot = get('Oil_Purchases', 'Purchase_ID', this.lot), p = lot ? num(lot.Price_per_unit) : K.costPrice(this.fid);
    el.innerHTML = `<div class="grid3"><div><div class="mut sm">الإجمالي</div><b>${x.pcs} قطعة · ${r0(x.ml)} مل</b></div><div><div class="mut sm">زيت</div><b>${r2(x.oil)} جم</b></div><div><div class="mut sm">كحول</div><b>${r2(x.alcG)} جم = ${r2(x.alcMl)} مل</b></div></div>
      <div class="mut sm">تكلفة القطعة (مرحلة أولى، ${r2(p)} ج/جم): ${Object.entries(this.plan).filter(([, n]) => n > 0).map(([v]) => v + ' مل = ' + r2(K.unitCost(+v, p, x.c))).join(' · ')}</div>
      ${warn.length ? `<div class="note warn sm">${warn.map(esc).join('<br>')}</div>` : '<div class="note ok sm">المخزون يكفي ✓</div>'}`;
  },
  async save() {
    const f = K.frag(this.fid), x = this.calcs(); if (!f || !x.pcs) return toast('اختار العطر والكميات');
    const date = this.date, id = newId('PB', 'Production_Batches', date), lot = get('Oil_Purchases', 'Purchase_ID', this.lot);
    const oil = num(this.oilAct) ?? Math.round(x.oil * 100) / 100, alcG = num(this.alcAct) ?? Math.round(x.alcG * 100) / 100;
    const p = lot ? num(lot.Price_per_unit) : K.costPrice(this.fid);
    add('Production_Batches', { Batch_ID: id, Date: date, Fragrance_ID: this.fid, Oil_Lot_Purchase_ID: this.lot || null, House: lot ? lot.House : null, Concentration: Math.round(x.c * 10000) / 10000, Oil_g: oil, Alcohol_g: alcG, Alcohol_ml: Math.round(alcG / (C('Alcohol_Density') || .808) * 100) / 100, Mix_Total_g: oil + alcG,
      Output_Plan: Object.entries(this.plan).filter(([, n]) => n > 0).map(([v, n]) => n + '×' + v).join(' + ') + ' ml', Pieces_Filled: x.pcs, Waste_g: num(this.waste), Maceration_Start: date, Ready_Date: addDays(date, num(this.days) || 0), QC_Status: 'Pending', Record_Status: 'Valid', Notes: this.notes || null });
    const mv = (code, type, mt, qty, unit, note) => add('Stock_Movements', { Move_ID: newId('SM', 'Stock_Movements', date), Date: date, Stock_Code: code, Stock_Type: type, Movement_Type: mt, Qty: Math.round(qty * 10000) / 10000, Unit: unit, Ref_Doc: id, Location: 'L01', Record_Status: 'Valid', Notes: note || null });
    mv('OIL-' + this.fid, 'Oil', 'Production Out', -oil, 'g', f.Name_EN);
    mv('AL-ETH96', 'Item', 'Production Out', -(alcG / (C('Alcohol_Density') || .808)) / 1000, 'L');
    for (const [g, n] of Object.entries(x.need)) mv(g, 'Item', 'Production Out', -n, 'piece');
    mv('LB-800837', 'Item', 'Production Out', -x.pcs / 72, 'sheet', x.pcs + ' labels');
    if (this.logo) mv('PR-LOGO', 'Item', 'Production Out', -x.pcs / 540, 'sheet', x.pcs + ' logos');
    for (const [v, n] of Object.entries(this.plan)) {
      if (!(n > 0)) continue; const sku = K.sku(this.fid, +v);
      if (!K.product(sku)) add('Products', { SKU: sku, Fragrance_ID: this.fid, Size_ml: +v, Product_Name_AR: K.fname(this.fid) + ' ' + v + ' مل', Glass_Item_ID: (get('Size_Defaults', 'Size_ml', v) || {}).Default_Glass_Item_ID, Concentration: num(this.conc) ? x.c : null, Stage: 'Testing', Status: 'Active', Notes: 'Created by batch ' + id });
      add('Batch_Outputs', { Output_ID: newId('BO', 'Batch_Outputs', date), Batch_ID: id, SKU: sku, Qty: n, Unit_Cost_Stage1: Math.round(K.unitCost(+v, p, x.c) * 100) / 100, Record_Status: 'Valid' });
      mv(sku, 'Product', 'Production In', n, 'piece');
    }
    await commit('اتسجلت التشغيلة ✓ — جاهزة ' + dmy(addDays(date, num(this.days) || 0)));
    this.init({}); Router.render(true);
  }
};

/* ================= 9. Stock ================= */
const stk = SCREENS.stock = {

  init() { this.t = this.t || 'Product'; this.q = ''; this.adj = null; },
  render() {
    const tabs = [['Product', 'منتجات'], ['Oil', 'زيوت'], ['Item', 'مستلزمات']];
    return `<div class="seg">${tabs.map(([k, l]) => `<button class="${this.t === k ? 'on' : ''}" onclick="stk.t='${k}';Router.render(true)">${l}</button>`).join('')}</div>

const rep = SCREENS.reports = {
  title: 'التقارير', sub: () => 'المبيعات · التحصيل · المشتريات · المصروفات',
  init() { this.month = this.month || ymd().slice(0, 7); },
  render() {
    const m = this.month, inM = d => String(d || '').startsWith(m);
    const os = T('Orders').filter(o => VALID(o) && o.Status !== 'Cancelled' && inM(o.Order_Date));
    let sub = 0, disc = 0, ship = 0, tot = 0, paid = 0, rem = 0, cogs = 0, pcs = 0; const top = {};
    for (const o of os) {
      const t = K.orderTotals(o); sub += t.sub; disc += t.refD + t.man; ship += t.ship; tot += t.total; paid += t.paid; rem += t.rem;
      for (const l of t.lines) { cogs += (num(l.Unit_Cost_Stage1) || 0) * (num(l.Qty) || 0); pcs += num(l.Qty) || 0; if (l.Line_Type === 'Product') top[l.Description] = (top[l.Description] || 0) + (num(l.Qty) || 0); }
    }
    const oc = T('Order_Costs').filter(c => VALID(c) && os.some(o => o.Order_ID === c.Order_ID)).reduce((a, c) => a + (num(c.Total) ?? (num(c.Qty) || 0) * (num(c.Unit_Cost) || 0)), 0);
    const courier = os.reduce((a, o) => a + (num(o.Courier_Cost_Actual) || 0), 0);
    const ex = T('Expenses').filter(e => VALID(e) && inM(e.Date)).reduce((a, e) => a + (num(e.Amount) || 0), 0);
    const op = T('Oil_Purchases').filter(e => VALID(e) && inM(e.Date)).reduce((a, e) => a + (num(e.Total) ?? ((num(e.Qty) * num(e.Price_per_unit)) || 0)), 0);
    const xp = T('Other_Purchases').filter(e => VALID(e) && inM(e.Date)).reduce((a, e) => a + (num(e.Total) ?? ((num(e.Qty) * num(e.Unit_Price)) || 0)), 0);
    const gross = sub - disc - cogs - oc + (ship - courier);
    const kv = (k, v, cls = '') => `<div class="kv"><span>${k}</span><b class="${cls}">${v}</b></div>`;
    const due = T('Orders').filter(o => VALID(o) && o.Status !== 'Cancelled').map(o => ({ o, r: K.orderTotals(o).rem })).filter(x => x.r > 0.009);
    return `<div class="row"><input type="month" value="${m}" onchange="rep.month=this.value;Router.render(true)" style="width:170px"></div>
    <div class="card"><b class="gold">المبيعات (${os.length} أوردر · ${pcs} قطعة)</b>${kv('إجمالي الأصناف', money(sub))}${kv('الخصومات', '− ' + money(disc))}${kv('شحن وتغليف محصّل', money(ship))}${kv('الإجمالي المستحق', money(tot), 'gold')}${kv('اتحصل', money(paid), 'grn')}${kv('لسه', money(rem), 'org')}</div>
    <div class="card"><b class="gold">الربحية التقريبية</b>${kv('تكلفة المنتجات (مرحلة 1)', money(cogs))}${kv('تكلفة التغليف والشحن (مرحلة 2/3)', money(oc))}${kv('شحن فعلي لشركة الشحن', money(courier))}${kv('إجمالي الربح قبل المصروفات', money(gross), gross >= 0 ? 'grn' : 'red')}${kv('المصروفات', '− ' + money(ex))}${kv('صافي تقريبي', money(gross - ex), gross - ex >= 0 ? 'grn' : 'red')}</div>
    <div class="card"><b class="gold">المشتريات</b>${kv('زيوت', money(op))}${kv('مستلزمات', money(xp))}</div>
    <div class="card"><b class="gold">الأكثر مبيعًا</b>${Object.entries(top).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([k, v]) => kv(esc(k), v)).join('') || '<div class="mut">—</div>'}</div>
    <div class="card"><b class="gold">فلوس عند العملاء (كل الشهور)</b>${due.map(x => `<div class="kv"><a class="ltr" href="#orders?id=${x.o.Order_ID}">${esc(x.o.Order_Code)}</a><span>${esc(x.o.Customer_Name)} · <b class="org">${money(x.r)}</b></span></div>`).join('') || '<div class="mut">مفيش</div>'}</div>`;
  }
};
