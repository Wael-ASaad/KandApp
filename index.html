  setItem(id, quiet) { this.item = id; const it = K.item(id); if (it) { this.unit = it.Unit || 'piece'; if (!this.sup && it.Default_Supplier && it.Default_Supplier !== 'غير مسجل') this.sup = it.Default_Supplier; } if (!quiet) Router.render(true); },
  /* ---- W6: new item from inside the purchase ---- */
  PFX: { Glass: 'GL', Alcohol: 'AL', Label: 'LB', Print: 'PR', Packaging: 'PK', Shipping: 'SH', Tools: 'TL' },
  newItem() { this.ni = { Category: this.cat || 'Glass', newCat: '', Name_AR: '', Unit: 'piece', Pieces_per_Unit: 1, Size_ml: '', Default_Supplier: this.sup || '', Reorder_Point: '', Subcategory: '' }; Router.render(true); },
  rNew() {
    const n = this.ni, cats = [...new Set(T('Items').map(i => i.Category))];
    return `<div class="card"><b class="gold">صنف جديد</b>
      ${field('الفئة', `<select onchange="pur.ni.Category=this.value;Router.render(true)">${cats.map(c => opt(c, c, n.Category)).join('')}${opt('__new', 'فئة جديدة…', n.Category)}</select>`)}
      ${n.Category === '__new' ? field('اسم الفئة الجديدة (إنجليزي)', `<input class="ltr" value="${esc(n.newCat)}" oninput="pur.ni.newCat=this.value">`, true) : ''}
      ${field('اسم الصنف', `<input value="${esc(n.Name_AR)}" placeholder="مثلاً: علبة هدايا مقاس 20" oninput="pur.ni.Name_AR=this.value">`, true)}
      <div class="grid2">${field('الوحدة اللي بتشتري بيها', `<select onchange="pur.ni.Unit=this.value;pur.ni.Pieces_per_Unit=this.value==='dozen'?12:1;Router.render(true)">${['piece', 'dozen', 'sheet', 'L', 'roll', 'kg', 'g'].map(u => opt(u, { piece: 'قطعة', dozen: 'دستة', sheet: 'شيت', L: 'لتر', roll: 'رول', kg: 'كيلو', g: 'جرام' }[u], n.Unit)).join('')}</select>`)}
        ${field('كام قطعة في الوحدة', `<input type="number" value="${esc(n.Pieces_per_Unit)}" oninput="pur.ni.Pieces_per_Unit=this.value">`)}
        ${n.Category === 'Glass' ? field('الحجم (مل)', `<input type="number" value="${esc(n.Size_ml)}" oninput="pur.ni.Size_ml=this.value">`) : ''}
        ${field('حد إعادة الطلب', `<input type="number" value="${esc(n.Reorder_Point)}" placeholder="اختياري" oninput="pur.ni.Reorder_Point=this.value">`)}
        ${field('المورد المعتاد', `<select onchange="pur.ni.Default_Supplier=this.value"><option value="">—</option>${K.suppliers().map(s => opt(s.Supplier_AR, s.Supplier_AR, n.Default_Supplier)).join('')}</select>`)}</div>
      <div class="grid2"><button class="btn" onclick="pur.saveItem()">حفظ الصنف واختياره</button><button class="btn dark" onclick="pur.ni=null;Router.render(true)">إلغاء</button></div></div>`;
  },
  async saveItem() {
    const n = this.ni, catg = n.Category === '__new' ? n.newCat.trim() : n.Category;
    if (!n.Name_AR.trim() || !catg) return toast('اكتب اسم الصنف والفئة');
    if (T('Items').some(i => norm(i.Name_AR) === norm(n.Name_AR))) return toast('فيه صنف بنفس الاسم');
    const px = this.PFX[catg] || catg.slice(0, 2).toUpperCase(), used = T('Items').filter(i => String(i.Item_ID).startsWith(px + '-N')).map(i => parseInt(String(i.Item_ID).split('-N')[1]) || 0);
    const id = px + '-N' + pad(Math.max(0, ...used) + 1, 2);
    add('Items', { Item_ID: id, Category: catg, Subcategory: n.Subcategory || null, Name_AR: n.Name_AR.trim(), Name_EN: null, Size_ml: num(n.Size_ml), Unit: n.Unit, Pieces_per_Unit: num(n.Pieces_per_Unit) || 1, Default_Supplier: n.Default_Supplier || null, Stock_Tracked: 'Applicable', Reorder_Point: num(n.Reorder_Point), Dimensions_Status: 'To measure', Status: 'Active', Notes: 'Added in app' });
    this.ni = null; this.cat = catg; this.setItem(id, true); await commit('اتضاف الصنف ' + n.Name_AR + ' ✓'); Router.render(true);
  },
  paint() {
    const it = K.item(this.item), q = num(this.qty), p = num(this.price), el = $('#pur_tot'); if (!el) return;
    if (!it || !q || !p) { el.textContent = ''; return; }
    const sq = stockQty(it, q, this.unit), ppp = this.unit === 'dozen' ? p / (num(it.Pieces_per_Unit) || 12) : p;
    el.innerHTML = `الإجمالي ${money(q * p)} ج · يدخل المخزون ${r2(sq)} ${stockUnit(it, this.unit) === 'piece' ? 'قطعة' : stockUnit(it, this.unit)} · ${r2(ppp)} ج للوحدة`;
  },
  async save() {
    const it = K.item(this.item), q = num(this.qty), p = num(this.price);
    if (!it || !(q > 0) || !(p >= 0) || this.price === '') return toast('اختار الصنف واكتب الكمية والسعر');
    const date = this.date, id = newId('XP', 'Other_Purchases', date), ppu = this.unit === 'dozen' ? (num(it.Pieces_per_Unit) || 12) : 1;
    const ppp = p / ppu, tot = num(this.total) ?? Math.round(q * p * 100) / 100;
    if (this.editId) Recent.cancelRows('Other_Purchases', this.editId, 'Edited in app');
    add('Other_Purchases', { Purchase_ID: id, Date: date, Item_Type: ITEM_TYPE[it.Category] || it.Category, Item_ID: it.Item_ID, Item: it.Name_AR, Supplier: this.sup || null, Qty: q, Unit: this.unit, Pieces_per_Unit: ppu, Unit_Price: p, Total: tot, Price_per_Piece: Math.round(ppp * 10000) / 10000, Record_Status: this.editId ? 'Edited' : 'Valid', Edited_From: this.editId || null, Notes: this.notes || null, Payment_Method: this.pay, Amount_Paid: num(this.paid) ?? tot });
    if (it.Stock_Tracked !== 'Not applicable') add('Stock_Movements', { Move_ID: newId('SM', 'Stock_Movements', date), Date: date, Stock_Code: it.Item_ID, Stock_Type: 'Item', Movement_Type: 'Purchase In', Qty: stockQty(it, q, this.unit), Unit: stockUnit(it, this.unit), Ref_Doc: id, Location: 'L01', Record_Status: 'Valid', Notes: it.Name_AR });
    // price list: new Active price if it changed (old one → Inactive)
    const per = stockUnit(it, this.unit), cur = T('Item_Prices').find(r => r.Item_ID === it.Item_ID && r.Status === 'Active');
    if (!cur || Math.abs((num(cur.Price) || 0) - ppp) > 0.0001) {
      if (cur) upd('Item_Prices', null, { Status: 'Inactive' }, 'New purchase price', { Item_ID: it.Item_ID, Status: 'Active' });
      add('Item_Prices', { Item_ID: it.Item_ID, Price: Math.round(ppp * 10000) / 10000, Per: per, Price_Type: 'Purchase', From_Date: date, Supplier: this.sup || null, Notes: q + ' ' + this.unit + ' × ' + p, Status: 'Active' });
    }
    await commit('اتسجل الشراء ودخل المخزون ✓', true); const wasEdit = this.editId; this.init({}); if (wasEdit) Router.go('purchase'); else Router.render(true);
  }
};

/* ================= 6. Production: (A) mix for maceration · (B) fill bottles ================= */
const bat = SCREENS.batch = {
  title: 'تشغيلة / تعبئة', sec: 'stock', sub: () => bat.mode === 'mix' ? 'زيت مركز + كحول → خلطة بتتعتق في المخزون' : 'خلطة جاهزة أو زيت → عبوات في المخزون',
  init(p) {
    const pm = p.mix ? K.mixes(false).find(m => m.code === p.mix) : null;
    Object.assign(this, { mode: p.mode || this.mode || 'mix', fid: p.fid || (pm && pm.fid) || null, q: '', open: !p.fid, allF: false, lot: '', conc: '', ml: '', oilIn: '', plan: {}, src: 'mix', mix: p.mix || '',
      oilAct: '', alcAct: '', waste: '', days: C('Maceration_Days') || 15, logo: K.stock('PR-LOGO') > 0, notes: '', date: ymd() });
  },
  pick(fid) { this.fid = fid; this.q = ''; this.open = false; this.lot = ''; Router.render(true); },
  /* fragrances that have oil in stock (the picker shows only these unless «كل العطور») */
  oilList() { return K.stockAll().filter(s => s.code.startsWith('OIL-') && s.qty > 0.01).map(s => ({ fid: s.code.slice(4), g: s.qty })).sort((x, y) => K.fname(x.fid).localeCompare(K.fname(y.fid), 'ar')); },
  oilPicker() {
    const xs = this.oilList();
    return `<div class="card"><b class="gold">اختار الزيت (اللي في المخزون بس)</b>
      ${xs.length ? `<div class="list">${xs.map(x => `<button class="li" onclick="bat.pick('${x.fid}')"><b>${esc(K.fname(x.fid))}</b><span>${r2(x.g)} جم في المخزون</span></button>`).join('')}</div>` : '<div class="note warn sm">مفيش زيوت في المخزون — سجّل شراء زيت الأول</div>'}
      <button class="chip" onclick="bat.allF=!bat.allF;Router.render(true)">${this.allF ? 'إخفاء' : 'عطر مش في القايمة؟'}</button>
      ${this.allF ? Picker.html(this, 'bat') : ''}</div>`;
  },
  c() { const v = num(this.conc); if (v > 0) return v / 100; const lot = get('Oil_Purchases', 'Purchase_ID', this.lot); if (lot && num(lot.Concentration)) return num(lot.Concentration); return K.conc(this.fid).c; },
  lotPrice() { const lot = get('Oil_Purchases', 'Purchase_ID', this.lot); return lot ? num(lot.Price_per_unit) : K.costPrice(this.fid); },
  render() {
    const seg = `<div class="seg"><button class="${this.mode === 'mix' ? 'on' : ''}" onclick="bat.mode='mix';Router.render(true)">خلطة للتعتيق</button><button class="${this.mode === 'fill' ? 'on' : ''}" onclick="bat.mode='fill';Router.render(true)">تعبئة عبوات</button></div>`;
    return seg + (this.mode === 'mix' ? this.rMix() : this.rFill()) + Recent.html('Production_Batches', 4);
  },
  /* ---------- A. mix ---------- */
  rMix() {
    const f = this.fid && K.frag(this.fid);
    if (!f) return `<div class="note info sm">بتخلط الزيت المركز مع الكحول بالتركيز اللي تختاره، والخلطة بتدخل المخزون كصنف لوحده (مثلاً «خلطة يارا 30% — 120 مل») لحد ما تعبّيها.</div>` + this.oilPicker();
    const lots = T('Oil_Purchases').filter(r => r.Fragrance_ID === this.fid && VALID(r));
    return `<div class="card"><div class="row"><b class="big sp">${esc(f.Name_AR)}</b><button class="chip" onclick="bat.fid=null;Router.render(true)">تغيير</button></div>
      <div class="kv"><span>الزيت في المخزون</span><b>${r2(K.stock('OIL-' + this.fid))} جم</b></div>
      ${field('من أنهي شراء (اللوت)', `<select onchange="bat.lot=this.value;Router.render(true)"><option value="">آخر سعر</option>${lots.map(l => opt(l.Purchase_ID, dmy(l.Date) + ' · ' + (l.Supplier || '—') + ' · ' + (l.House || '—') + ' · ' + r2(num(l.Price_per_unit)) + ' ج/جم · ' + r0(num(l.Qty)) + ' جم', this.lot)).join('')}</select>`)}
      <div class="grid2">${field('التركيز % (بالوزن)', `<input type="number" inputmode="decimal" value="${esc(this.conc)}" placeholder="${Math.round(this.c() * 100)}" oninput="bat.conc=this.value;bat.paintMix()">`)}
      ${field('التاريخ', `<input type="date" value="${this.date}" onchange="bat.date=this.value">`)}</div>
      <div class="grid2">${field('حجم الخلطة (مل)', `<input type="number" inputmode="decimal" value="${esc(this.ml)}" placeholder="مثلاً 120" oninput="bat.ml=this.value;bat.oilIn='';bat.paintMix()">`)}
      ${field('أو: هستخدم كام جرام زيت', `<input type="number" inputmode="decimal" value="${esc(this.oilIn)}" placeholder="مثلاً 30" oninput="bat.oilIn=this.value;bat.ml='';bat.paintMix()">`)}</div>
      <div class="chips">${chip(false, 'كل الزيت اللي في المخزون', `bat.oilIn='${r2(K.stock('OIL-' + this.fid))}';bat.ml='';Router.render(true)`)}</div></div>
    <div class="card" id="bat_calc"></div>
    <div class="card"><div class="grid3">${field('زيت فعلي جم', `<input type="number" inputmode="decimal" value="${esc(this.oilAct)}" oninput="bat.oilAct=this.value">`)}${field('كحول فعلي جم', `<input type="number" inputmode="decimal" value="${esc(this.alcAct)}" oninput="bat.alcAct=this.value">`)}${field('أيام التعتيق', `<input type="number" value="${this.days}" oninput="bat.days=this.value">`)}</div>
      ${field('ملاحظات', `<input value="${esc(this.notes)}" oninput="bat.notes=this.value">`)}</div>
    <div class="savebar"><button class="btn" onclick="bat.saveMix()">حفظ الخلطة</button></div>`;
  },
  mixCalc() {
    const c = this.c(), { og, al } = K.mix(c);
    let ml = num(this.ml); if (!(ml > 0) && num(this.oilIn) > 0) ml = num(this.oilIn) / og;
    if (!(ml > 0)) return null;
    const oil = ml * og, alcMl = ml * al, p = this.lotPrice(), ap = C('Alcohol_Price') || 160;
    return { c, ml, oil, alcMl, alcG: alcMl * (C('Alcohol_Density') || .808), cost: oil * p + alcMl / 1000 * ap, p };
  },
  paintMix() {
    const el = $('#bat_calc'); if (!el) return; const x = this.mixCalc();
    if (!x) { el.innerHTML = '<div class="mut">اكتب حجم الخلطة أو كمية الزيت</div>'; return; }
    const st = K.stock('OIL-' + this.fid), sa = K.stock('AL-ETH96') * 1000, okO = x.oil <= st + 0.001, okA = x.alcMl <= sa + 0.1;
    el.innerHTML = `<div class="grid3"><div><div class="mut sm">الخلطة</div><b>${r0(x.ml)} مل · ${pct(x.c)}</b></div><div><div class="mut sm">زيت</div><b class="${okO ? '' : 'red'}">${r2(x.oil)} جم</b><div class="mut sm">من ${r2(st)}</div></div><div><div class="mut sm">كحول</div><b class="${okA ? '' : 'red'}">${r2(x.alcG)} جم = ${r0(x.alcMl)} مل</b><div class="mut sm">من ${r0(sa)} مل</div></div></div>
      <div class="kv"><span>تكلفة الخلطة (زيت ${r2(x.p)} ج/جم + كحول)</span><b>${money(x.cost)} ج = ${r2(x.cost / x.ml)} ج/مل</b></div>
      ${okO && okA ? '<div class="note ok sm">المخزون يكفي ✓</div>' : `<div class="note bad sm">${!okO ? 'الزيت اللي في المخزون مش كفاية. ' : ''}${!okA ? 'الكحول مش كفاية.' : ''}</div>`}`;
  },
  async saveMix() {
    const f = K.frag(this.fid), x = this.mixCalc(); if (!f || !x) return toast('اختار الزيت والكمية');
    if (x.oil > K.stock('OIL-' + this.fid) + 0.001 && !(await ask('الزيت المطلوب (' + r2(x.oil) + ' جم) أكتر من المخزون (' + r2(K.stock('OIL-' + this.fid)) + ' جم). أسجل برضه؟'))) return;
    const date = this.date, id = newId('PB', 'Production_Batches', date), lot = get('Oil_Purchases', 'Purchase_ID', this.lot), code = 'MIX-' + id;
    const oil = num(this.oilAct) ?? Math.round(x.oil * 100) / 100, alcG = num(this.alcAct) ?? Math.round(x.alcG * 100) / 100, ad = C('Alcohol_Density') || .808;
    const ml = Math.round((oil / (C('Oil_Density') || .9414) + alcG / ad) * 10) / 10, cost = oil * x.p + alcG / ad / 1000 * (C('Alcohol_Price') || 160);
    add('Production_Batches', { Batch_ID: id, Date: date, Fragrance_ID: this.fid, Oil_Lot_Purchase_ID: this.lot || null, House: lot ? lot.House : null, Concentration: Math.round(oil / (oil + alcG) * 10000) / 10000, Oil_g: oil, Alcohol_g: alcG, Alcohol_ml: Math.round(alcG / ad * 100) / 100, Mix_Total_g: oil + alcG,
      Output_Plan: 'MIX ' + ml + ' ml', Pieces_Filled: 0, Waste_g: null, Maceration_Start: date, Ready_Date: addDays(date, num(this.days) || 0), QC_Status: 'Pending', Record_Status: 'Valid', Notes: this.notes || 'Mix for maceration' });
    add('Batch_Outputs', { Output_ID: newId('BO', 'Batch_Outputs', date), Batch_ID: id, SKU: code, Qty: ml, Unit_Cost_Stage1: Math.round(cost / ml * 10000) / 10000, Record_Status: 'Valid' });
    const mv = (c, type, mt, qty, unit, note) => add('Stock_Movements', { Move_ID: newId('SM', 'Stock_Movements', date), Date: date, Stock_Code: c, Stock_Type: type, Movement_Type: mt, Qty: Math.round(qty * 10000) / 10000, Unit: unit, Ref_Doc: id, Location: 'L02', Record_Status: 'Valid', Notes: note || null });
    mv('OIL-' + this.fid, 'Oil', 'Production Out', -oil, 'g', f.Name_EN);
    mv('AL-ETH96', 'Item', 'Production Out', -(alcG / ad) / 1000, 'L');
    mv(code, 'Mix', 'Production In', ml, 'ml', f.Name_EN + ' ' + Math.round(oil / (oil + alcG) * 100) + '%');
    await commit('اتسجلت الخلطة ✓ — ' + ml + ' مل، جاهزة ' + dmy(addDays(date, num(this.days) || 0)), true);
    this.init({}); this.mode = 'fill'; Router.render(true);
  },
  /* ---------- B. fill ---------- */
  rFill() {
    const mixes = K.mixes();
    const srcSeg = `<div class="seg"><button class="${this.src === 'mix' ? 'on' : ''}" onclick="bat.src='mix';Router.render(true)">من خلطة</button><button class="${this.src === 'oil' ? 'on' : ''}" onclick="bat.src='oil';Router.render(true)">زيت مباشر</button></div>`;
    let head = '';
    if (this.src === 'mix') {
      if (!mixes.length) return srcSeg + '<div class="note warn">مفيش خلطات في المخزون. اعمل «خلطة للتعتيق» الأول، أو عبّي من «زيت مباشر».</div>';
      const m = mixes.find(x => x.code === this.mix);
      head = `<div class="card"><b class="gold">اختار الخلطة</b><div class="list">${mixes.map(x => `<button class="li" style="${x.code === this.mix ? 'background:var(--goldbg)' : ''}" onclick="bat.mix='${x.code}';bat.fid='${x.fid}';Router.render(true)"><b>${esc(K.fname(x.fid))} ${pct(x.conc)}</b><span>${r0(x.left)} مل · ${x.ready && x.ready > ymd() ? '<span class="org">جاهزة ' + dmy(x.ready) + '</span>' : '<span class="grn">جاهزة</span>'}</span></button>`).join('')}</div>
        ${m && m.ready > ymd() ? `<div class="note warn sm">الخلطة دي لسه في التعتيق لحد ${dmy(m.ready)}</div>` : ''}</div>`;
      if (!m) return srcSeg + head;
    } else {
      const f = this.fid && K.frag(this.fid);
      if (!f) return srcSeg + this.oilPicker();
      const lots = T('Oil_Purchases').filter(r => r.Fragrance_ID === this.fid && VALID(r));
      head = `<div class="card"><div class="row"><b class="big sp">${esc(f.Name_AR)}</b><button class="chip" onclick="bat.fid=null;Router.render(true)">تغيير</button></div>
        <div class="kv"><span>الزيت في المخزون</span><b>${r2(K.stock('OIL-' + this.fid))} جم</b></div>
        ${field('من أنهي شراء (اللوت)', `<select onchange="bat.lot=this.value;Router.render(true)"><option value="">آخر سعر</option>${lots.map(l => opt(l.Purchase_ID, dmy(l.Date) + ' · ' + (l.Supplier || '—') + ' · ' + r2(num(l.Price_per_unit)) + ' ج/جم', this.lot)).join('')}</select>`)}
        ${field('التركيز % (بالوزن)', `<input type="number" inputmode="decimal" value="${esc(this.conc)}" placeholder="${Math.round(this.c() * 100)}" oninput="bat.conc=this.value;bat.paintFill()">`)}</div>`;
    }
    return srcSeg + head + `
    <div class="card"><b class="gold">هتعبّي كام؟</b>${K.sizes().map(v => `<div class="row"><span style="width:60px"><b>${v}</b> مل</span><span class="mut sm sp">زجاج ${esc((get('Size_Defaults', 'Size_ml', v) || {}).Default_Glass_Item_ID || '')} · مخزون ${r0(K.stock((get('Size_Defaults', 'Size_ml', v) || {}).Default_Glass_Item_ID))}</span>
      <span class="qty"><button class="qb" onclick="bat.q2(${v},1)">+</button><span>${this.plan[v] || 0}</span><button class="qb" onclick="bat.q2(${v},-1)">−</button></span></div>`).join('')}</div>
    <div class="card" id="bat_calc"></div>
    <div class="card"><div class="grid2">${field('التاريخ', `<input type="date" value="${this.date}" onchange="bat.date=this.value">`)}${field('هالك مل', `<input type="number" inputmode="decimal" value="${esc(this.waste)}" oninput="bat.waste=this.value">`)}</div>
      ${this.src === 'oil' ? field('أيام التعتيق', `<input type="number" value="${this.days}" oninput="bat.days=this.value">`) : ''}
      <label class="row sm"><input type="checkbox" style="width:22px;height:22px" ${this.logo ? 'checked' : ''} onchange="bat.logo=this.checked"> حطيت اللوجو (بيخصم من مخزون اللوجو)</label>
      ${field('ملاحظات', `<input value="${esc(this.notes)}" oninput="bat.notes=this.value">`)}</div>
    <div class="savebar"><button class="btn" onclick="bat.saveFill()">حفظ التعبئة</button></div>`;
  },
  after() { if (this.mode === 'mix' && this.fid) this.paintMix(); if (this.mode === 'fill') this.paintFill(); },
  q2(v, d) { this.plan[v] = Math.max(0, (this.plan[v] || 0) + d); Router.render(true); },
  fillCalc() {
    let ml = 0, pcs = 0; const need = {};
    for (const [v, n] of Object.entries(this.plan)) { if (!(n > 0)) continue; ml += v * n; pcs += n; const g = (get('Size_Defaults', 'Size_ml', v) || {}).Default_Glass_Item_ID; if (g) need[g] = (need[g] || 0) + n; }
    const x = { ml, pcs, need, wasteMl: num(this.waste) || 0 };
    if (this.src === 'mix') { const m = K.mixes().find(y => y.code === this.mix); if (!m) return null; Object.assign(x, { m, c: m.conc, perMl: m.perMl, useMl: ml + x.wasteMl, have: m.left }); }
    else { const c = this.c(), { og, al } = K.mix(c), p = this.lotPrice(); const use = ml + x.wasteMl; Object.assign(x, { c, og, al, p, oil: use * og, alcMl: use * al, perMl: og * p + al / 1000 * (C('Alcohol_Price') || 160), useMl: use, have: K.stock('OIL-' + this.fid) }); }
    return x;
  },
  paintFill() {
    const el = $('#bat_calc'); if (!el) return; const x = this.fillCalc();
    if (!x || !x.pcs) { el.innerHTML = '<div class="mut">زوّد الكميات فوق</div>'; return; }
    const warn = [];
    if (this.src === 'mix' && x.useMl > x.have + 0.01) warn.push('الخلطة مش كفاية: محتاج ' + r0(x.useMl) + ' مل والموجود ' + r0(x.have) + ' مل');
    if (this.src === 'oil') { if (x.oil > x.have + 0.001) warn.push('الزيت مش كفاية: محتاج ' + r2(x.oil) + ' جم والموجود ' + r2(x.have) + ' جم'); if (x.alcMl / 1000 > K.stock('AL-ETH96') + 0.0001) warn.push('الكحول مش كفاية'); }
    for (const [g, n] of Object.entries(x.need)) if (n > K.stock(g)) warn.push(K.itemName(g) + ': محتاج ' + n + ' والمخزون ' + r0(K.stock(g)));
    if (x.pcs / 72 > K.stock('LB-800837')) warn.push('الليبل مش كفاية');
    if (this.logo && x.pcs / 540 > K.stock('PR-LOGO')) warn.push('اللوجو مش في المخزون (شيل العلامة لو مش هتحطه)');
    el.innerHTML = `<div class="grid3"><div><div class="mut sm">الإجمالي</div><b>${x.pcs} قطعة · ${r0(x.ml)} مل</b></div>
      ${this.src === 'mix' ? `<div><div class="mut sm">من الخلطة</div><b>${r0(x.useMl)} مل</b><div class="mut sm">من ${r0(x.have)}</div></div><div><div class="mut sm">تركيز</div><b>${pct(x.c)}</b></div>`
        : `<div><div class="mut sm">زيت</div><b>${r2(x.oil)} جم</b><div class="mut sm">من ${r2(x.have)}</div></div><div><div class="mut sm">كحول</div><b>${r0(x.alcMl)} مل</b></div>`}</div>
      <div class="mut sm">تكلفة القطعة (مرحلة أولى): ${Object.entries(this.plan).filter(([, n]) => n > 0).map(([v]) => v + ' مل = ' + r2(K.unitCostLiquid(+v, x.perMl))).join(' · ')}</div>
      ${warn.length ? `<div class="note bad sm">${warn.map(esc).join('<br>')}</div>` : '<div class="note ok sm">المخزون يكفي ✓</div>'}`;
  },
  async saveFill() {
    const x = this.fillCalc(); if (!x || !x.pcs) return toast('اختار المصدر والكميات');
    const fid = this.src === 'mix' ? x.m.fid : this.fid, f = K.frag(fid); if (!f) return toast('اختار العطر');
    const short = this.src === 'mix' ? x.useMl > x.have + 0.01 : x.oil > x.have + 0.001;
    if (short && !(await ask('الكمية المطلوبة أكتر من اللي في المخزون. أسجل برضه؟'))) return;
    const date = this.date, id = newId('PB', 'Production_Batches', date), ad = C('Alcohol_Density') || .808;
    const og = K.mix(x.c).og, al = K.mix(x.c).al, oilG = Math.round(x.useMl * og * 100) / 100, alcG = Math.round(x.useMl * al * ad * 100) / 100;
    const lot = this.src === 'oil' ? get('Oil_Purchases', 'Purchase_ID', this.lot) : null;
    add('Production_Batches', { Batch_ID: id, Date: date, Fragrance_ID: fid, Oil_Lot_Purchase_ID: this.src === 'mix' ? (x.m.batch.Oil_Lot_Purchase_ID || null) : (this.lot || null), House: this.src === 'mix' ? x.m.batch.House : (lot ? lot.House : null), Concentration: Math.round(x.c * 10000) / 10000, Oil_g: oilG, Alcohol_g: alcG, Alcohol_ml: Math.round(alcG / ad * 100) / 100, Mix_Total_g: oilG + alcG,
      Output_Plan: Object.entries(this.plan).filter(([, n]) => n > 0).map(([v, n]) => n + '×' + v).join(' + ') + ' ml' + (this.src === 'mix' ? ' from ' + x.m.code : ''), Pieces_Filled: x.pcs, Waste_g: x.wasteMl ? Math.round(x.wasteMl * (oilG + alcG) / x.useMl * 100) / 100 : null,
      Maceration_Start: this.src === 'mix' ? x.m.batch.Maceration_Start || x.m.batch.Date : date, Ready_Date: this.src === 'mix' ? x.m.ready : addDays(date, num(this.days) || 0), QC_Status: 'Pending', Record_Status: 'Valid', Notes: this.notes || (this.src === 'mix' ? 'Filled from ' + x.m.code : null) });
    const mv = (c, type, mt, qty, unit, note) => add('Stock_Movements', { Move_ID: newId('SM', 'Stock_Movements', date), Date: date, Stock_Code: c, Stock_Type: type, Movement_Type: mt, Qty: Math.round(qty * 10000) / 10000, Unit: unit, Ref_Doc: id, Location: 'L01', Record_Status: 'Valid', Notes: note || null });
    if (this.src === 'mix') mv(x.m.code, 'Mix', 'Production Out', -x.useMl, 'ml', f.Name_EN);
    else { mv('OIL-' + fid, 'Oil', 'Production Out', -oilG, 'g', f.Name_EN); mv('AL-ETH96', 'Item', 'Production Out', -(alcG / ad) / 1000, 'L'); }
    for (const [g, n] of Object.entries(x.need)) mv(g, 'Item', 'Production Out', -n, 'piece');
    mv('LB-800837', 'Item', 'Production Out', -x.pcs / 72, 'sheet', x.pcs + ' labels');
    if (this.logo) mv('PR-LOGO', 'Item', 'Production Out', -x.pcs / 540, 'sheet', x.pcs + ' logos');
    for (const [v, n] of Object.entries(this.plan)) {
      if (!(n > 0)) continue; const sku = K.sku(fid, +v);
      if (!K.product(sku)) add('Products', { SKU: sku, Fragrance_ID: fid, Size_ml: +v, Product_Name_AR: K.fname(fid) + ' ' + v + ' مل', Glass_Item_ID: (get('Size_Defaults', 'Size_ml', v) || {}).Default_Glass_Item_ID, Concentration: Math.round(x.c * 10000) / 10000, Stage: 'Testing', Status: 'Active', Notes: 'Created by batch ' + id });
      add('Batch_Outputs', { Output_ID: newId('BO', 'Batch_Outputs', date), Batch_ID: id, SKU: sku, Qty: n, Unit_Cost_Stage1: Math.round(K.unitCostLiquid(+v, x.perMl) * 100) / 100, Record_Status: 'Valid' });
      mv(sku, 'Product', 'Production In', n, 'piece');
    }
    await commit('اتسجلت التعبئة ✓ — ' + x.pcs + ' قطعة دخلت المخزون', true);
    const keepMix = this.src === 'mix' ? this.mix : ''; this.init({}); this.mode = 'fill'; this.src = keepMix ? 'mix' : 'oil'; this.mix = keepMix; Router.render(true);
  }
};

/* ================= 9. Stock ================= */
const stk = SCREENS.inventory = {
  title: 'المخزون والجرد', sec: 'stock', sub: () => 'محسوب من حركات المخزون',
  init() { this.t = Auth.isSales() ? 'Product' : (this.t || 'Product'); this.q = ''; this.code = ''; this.kind = 'count'; this.qty = ''; this.why = ''; },
  units: { piece: 'قطعة', g: 'جم', L: 'لتر', sheet: 'شيت', roll: 'رول', ml: 'مل' },
  render() {
    const tabs = [['Product', 'منتجات'], ['Mix', 'خلطات'], ['Oil', 'زيوت'], ['Item', 'مستلزمات']].filter(t => !Auth.isSales() || t[0] === 'Product');
    if (Auth.isSales()) return `<div class="note info sm">بيظهرلك حالة كل منتج: متاح · قارب على الانتهاء · غير متوفر حاليا. وللعطور اللي محتاجة تعبئة أو تشغيل افتح «المتاح / الكتالوج».</div>
      <div class="search">${ICON.search}<input value="${esc(this.q)}" placeholder="بحث" oninput="stk.q=this.value;stk.paint()"></div><div id="stk_list" class="card"></div>`;
    const s = this.code ? (K.stockAll().find(x => x.code === this.code) || { code: this.code, qty: 0, unit: this.unitFor(this.code) }) : null;
    return `<div class="seg">${tabs.map(([k, l]) => `<button class="${this.t === k ? 'on' : ''}" onclick="stk.t='${k}';Router.render(true)">${l}</button>`).join('')}</div>
      <div class="search">${ICON.search}<input value="${esc(this.q)}" placeholder="بحث" oninput="stk.q=this.value;stk.paint()"></div><div id="stk_list" class="card"></div>
      <div class="card" id="adj"><b class="gold">زيادة / عجز / جرد</b>
        ${s ? `<div class="row"><b class="sp">${esc(K.stockName(s.code))}</b><span class="mut sm ltr">${esc(s.code)}</span><button class="chip" onclick="stk.code='';Router.render(true)">تغيير</button></div>
          <div class="kv"><span>الرصيد في البرنامج</span><b>${r2(s.qty)} ${esc(this.units[s.unit] || s.unit || '')}</b></div>
          <div class="seg">${[['count', 'جرد (العدد الفعلي)'], ['plus', 'زيادة'], ['minus', 'عجز']].map(([k, l]) => `<button class="${this.kind === k ? 'on' : ''}" onclick="stk.kind='${k}';Router.render(true)">${l}</button>`).join('')}</div>
          <div class="grid2">${field(this.kind === 'count' ? 'العدد الفعلي اللي عندك' : 'الكمية', `<input type="number" inputmode="decimal" value="${esc(this.qty)}" oninput="stk.qty=this.value;stk.paintDiff()">`)}${field('السبب', `<input value="${esc(this.why)}" placeholder="${this.kind === 'minus' ? 'كسر / عينة / تبخر' : 'جرد'}" oninput="stk.why=this.value">`)}</div>
          <div id="adj_diff" class="sm"></div><button class="btn" onclick="stk.adjust()">تسجيل</button>`
        : `<div class="mut sm">اضغط على أي صنف في القايمة فوق، أو اختار من هنا:</div><select onchange="stk.code=this.value;Router.render(true);document.getElementById('adj').scrollIntoView()"><option value="">اختار صنف…</option>
          ${K.stockAll().map(x => opt(x.code, K.stockName(x.code) + ' (' + r2(x.qty) + ')', '')).join('')}${T('Items').filter(i => !K.stockAll().some(x => x.code === i.Item_ID)).map(i => opt(i.Item_ID, i.Name_AR + ' (0)', '')).join('')}</select>`}
      </div>`;
  },
  unitFor(code) { const ex = K.stockAll().find(s => s.code === code); if (ex) return ex.unit; if (code.startsWith('OIL-')) return 'g'; if (code.startsWith('MIX-')) return 'ml'; if (K.product(code)) return 'piece'; const it = K.item(code); return stockUnit(it, it && it.Unit) || 'piece'; },
  after() { this.paint(); if (!Auth.isSales()) this.paintDiff(); },
  paint() {
    const n = norm(this.q);
    const xs = K.stockAll().filter(s => s.type === this.t).map(s => Object.assign(s, { name: K.stockName(s.code) })).filter(s => !n || norm(s.name + ' ' + s.code).includes(n)).sort((a, b) => a.name.localeCompare(b.name, 'ar'));
    const el = $('#stk_list'); if (!el) return;
    if (Auth.isSales()) { el.innerHTML = xs.map(s => `<div class="kv" style="padding:6px 0;border-bottom:1px solid var(--line2)"><span>${esc(s.name)}</span><b class="${s.qty <= 0 ? 'mut' : ''}">${K.qty(s.qty)}</b></div>`).join('') || '<div class="empty">مفيش</div>'; return; }
    el.innerHTML = xs.map(s => { const it = K.item(s.code), low = it && num(it.Reorder_Point) != null && s.qty <= num(it.Reorder_Point); return `<button class="kv" style="all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line2)" onclick="stk.code='${s.code}';stk.qty='';Router.render(true);document.getElementById('adj').scrollIntoView()"><span>${esc(s.name)} <span class="mut sm ltr">${esc(s.code)}</span></span><b class="${s.qty < 0 ? 'red' : low ? 'org' : ''}">${r2(s.qty)} ${esc(this.units[s.unit] || s.unit || '')}</b></button>`; }).join('') || '<div class="empty">مفيش</div>';
  },
  delta() { const q = num(this.qty); if (q == null) return null; if (this.kind === 'plus') return Math.abs(q); if (this.kind === 'minus') return -Math.abs(q); return q - K.stock(this.code); },
  paintDiff() { const el = $('#adj_diff'); if (!el) return; const d = this.delta(); el.innerHTML = d == null ? '' : d === 0 ? '<span class="grn">مطابق — مفيش فرق</span>' : `هيتسجل <b class="${d > 0 ? 'grn' : 'red'}">${d > 0 ? 'زيادة +' : 'عجز '}${r2(d)}</b>`; },
  async adjust() {
    const d = this.delta(); if (!this.code || d == null) return toast('اختار الصنف واكتب الكمية'); if (Math.abs(d) < 0.00001) return toast('مفيش فرق');

    await commit((d > 0 ? 'اتسجلت زيادة ' : 'اتسجل عجز ') + r2(Math.abs(d)) + ' ✓'); this.code = ''; this.qty = ''; this.why = ''; Router.render(true);
  }
};

  },
  async save() {

/* ================= 3.6 Buy suggestions (A8) ================= */
const Sug = {
  rate(code, days = 45) {   // average daily consumption from Sale/Gift/Sample/Production Out moves in the window
    const from = addDays(ymd(), -days); let out = 0, first = null;
    for (const m of T('Stock_Movements')) if (m.Stock_Code === code && VALID(m) && num(m.Qty) < 0 && /Out$/.test(m.Movement_Type)) { if (String(m.Date) >= from) out += -num(m.Qty); if (!first || String(m.Date) < first) first = String(m.Date); }
    if (!first) return 0; const span = Math.max(7, Math.min(days, Math.round((Date.now() - new Date(first + 'T00:00:00')) / 864e5) + 1));
    return out / span;
  },
  items() {
    return T('Items').filter(i => ACTIVE(i) && i.Stock_Tracked !== 'Not applicable' && K.stockAll().some(s => s.code === i.Item_ID)).map(i => {
      const qty = K.stock(i.Item_ID), r = this.rate(i.Item_ID), days = r ? qty / r : Infinity, rp = num(i.Reorder_Point);
      const flag = (rp != null && qty <= rp) || days < 21; const unit = i.Unit === 'dozen' ? 12 : 1, need = Math.max(rp || 0, r * 45) - qty;
      return { kind: 'Item', code: i.Item_ID, name: i.Name_AR, qty, rate: r, days, flag, suggest: need > 0 ? Math.ceil(need / unit) * unit : 0, unit: i.Unit === 'dozen' ? 'piece' : i.Unit, buyUnit: i.Unit, sup: i.Default_Supplier && i.Default_Supplier !== 'غير مسجل' ? i.Default_Supplier : null, price: K.itemPrice(i.Item_ID) };
    });
  },
  oils() {
    return K.stockAll().filter(s => s.type === 'Oil').map(s => {
      const fid = s.code.slice(4), r = this.rate(s.code, 60), days = r ? s.qty / r : Infinity, need = r * 60 - s.qty;
      const best = this.bestSource(fid), packs = [10, 30, 50, 100, 125, 250, 500, 1000];
      return { kind: 'Oil', code: fid, name: K.fname(fid), qty: s.qty, rate: r, days, flag: days < 21 || s.qty < 5, suggest: need > 0 ? (packs.find(p => p >= need) || Math.ceil(need)) : 0, unit: 'g', buyUnit: 'g', sup: best && best.sup, house: best && best.house, code2: best && best.code, price: best && best.p, src: best };
    });
  },
  bestSource(fid) {   // cheapest list code whose house has a known supplier, else last purchase
    const g = K.codes(fid), c = [];
    for (const [h, xs] of Object.entries(g)) { const sups = K.suppliersOf(h); if (sups.length) c.push({ house: h, sup: sups[0], code: xs[0].Code, p: num(xs[0].Price_per_g), t: 'سعر القايمة' }); }
    c.sort((a, b) => a.p - b.p); const lb = K.lastBuy(fid);
    return c[0] || (lb ? { house: lb.House, sup: lb.Supplier, code: lb.Code, p: num(lb.Price_per_unit), t: 'آخر شراء' } : null);
  }
};

  async setT(id, k, v) { const f = { [k]: String(v || '').trim() || null }; if (k === 'House') f.Oil_Code = null; upd('Shopping_Lists', id, f, 'Optional ' + k); await commit(); Router.render(true); },

  async tick(id, on) { upd('Shopping_Lists', id, { Status: on ? 'Bought' : 'Open' }, on ? 'Bought' : 'Unticked'); await commit(); Router.render(true); },
  async set(id, k, v) { upd('Shopping_Lists', id, { [k]: num(v) }, 'Actual'); await commit(); Router.render(true); },
  async skip(id) { upd('Shopping_Lists', id, { Status: 'Skipped' }, 'Removed'); await commit('اتشال'); Router.render(true); },
  async record() {
    const ls = T('Shopping_Lists').filter(l => VALID(l) && l.Status === 'Bought' && !l.Purchase_ID), date = ymd(); let n = 0;
    for (const l of ls) {

        add('Stock_Movements', { Move_ID: newId('SM', 'Stock_Movements', date), Date: date, Stock_Code: 'OIL-' + l.Code, Stock_Type: 'Oil', Movement_Type: 'Purchase In', Qty: q, Unit: 'g', Ref_Doc: id, Location: 'L01', Record_Status: 'Valid', Notes: f ? f.Name_EN : '' });
        upd('Shopping_Lists', l.Line_ID, { Purchase_ID: id, Actual_Qty: q, Actual_Price: p }, 'Recorded as purchase');
      } else {
        const it = K.item(l.Code); if (!it) continue; const id = newId('XP', 'Other_Purchases', date), unit = l.Unit || it.Unit, ppu = unit === 'dozen' ? (num(it.Pieces_per_Unit) || 12) : 1;
        add('Other_Purchases', { Purchase_ID: id, Date: date, Item_Type: ITEM_TYPE[it.Category] || it.Category, Item_ID: it.Item_ID, Item: it.Name_AR, Supplier: l.Supplier || null, Qty: q, Unit: unit, Pieces_per_Unit: ppu, Unit_Price: p, Total: Math.round(q * p * 100) / 100, Price_per_Piece: Math.round(p / ppu * 10000) / 10000, Record_Status: 'Valid', Edited_From: null, Notes: 'From shopping list ' + l.List_ID, Payment_Method: this.pay, Amount_Paid: Math.round(q * p * 100) / 100 });
        add('Stock_Movements', { Move_ID: newId('SM', 'Stock_Movements', date), Date: date, Stock_Code: it.Item_ID, Stock_Type: 'Item', Movement_Type: 'Purchase In', Qty: stockQty(it, q, unit), Unit: stockUnit(it, unit), Ref_Doc: id, Location: 'L01', Record_Status: 'Valid', Notes: it.Name_AR });
        upd('Shopping_Lists', l.Line_ID, { Purchase_ID: id, Actual_Qty: q, Actual_Price: p }, 'Recorded as purchase');
      }
      n++;
    }
    await commit('اتسجل ' + n + ' شراء ودخلوا المخزون ✓', true); Router.render(true);
  },
  text() {
    const lid = this.openList(false); if (!lid) return ''; const ls = this.lists()[lid].filter(l => l.Status === 'Open'), by = {};
    ls.forEach(l => (by[l.Supplier || 'من غير مورد'] = by[l.Supplier || 'من غير مورد'] || []).push(l));
    return '🛒 مشتريات K& — ' + dmy(ymd()).replace(/[⁦⁩]/g, '') + '\n' + Object.entries(by).map(([s, xs]) => '\n📍 ' + s + '\n' + xs.map(l => '☐ ' + l.Description + ' — ' + r0(l.Qty) + ' ' + (l.Unit === 'g' ? 'جم' : ({ dozen: 'دستة', piece: 'قطعة', sheet: 'شيت', L: 'لتر', roll: 'رول', kg: 'كيلو' })[l.Unit] || l.Unit || '')).join('\n')).join('\n');

  async copy() { const t = this.text(); try { await navigator.clipboard.writeText(t); toast('اتنسخت — الزقها في واتساب ✓'); } catch (e) { toast('مش قادر أنسخ'); } },
  async close() { const pn = T('Shopping_Lists').filter(l => VALID(l) && l.Status === 'Bought' && !l.Purchase_ID).length; if (pn) return toast('فيه ' + pn + ' حاجة متعلّم عليها ولسه ما اتسجلتش — اضغط «سجّل» الأول', 4000); if (!(await ask('تقفل القايمة؟ اللي ما اتعلّمش عليه هيتشال.'))) return; for (const l of T('Shopping_Lists').filter(l => VALID(l) && l.Status === 'Open')) upd('Shopping_Lists', l.Line_ID, { Status: 'Skipped' }, 'List closed'); await commit('اتقفلت القايمة ✓'); Router.render(true); }

/* ================= 4.2 Reports ================= */
const rep = SCREENS.reports = {
  title: 'التقارير', sec: 'more', sub: () => 'اختار التقرير والشهر',
  init(p) { this.month = this.month || ymd().slice(0, 7); this.tab = p.tab || this.tab || 'sales'; },
  render() {
    const tabs = [['sales', 'المبيعات والربحية'], ['orders', 'ربح الأوردرات'], ['avail', 'المنتجات المتاحة'], ['stock', 'المخزون وقيمته'], ['purch', 'المشتريات'], ['due', 'فلوس عند العملاء']];
    return `<div class="tabs">${tabs.map(([k, l]) => `<button class="${this.tab === k ? 'on' : ''}" onclick="rep.tab='${k}';Router.render(true)">${l}</button>`).join('')}</div>
      ${['sales', 'orders', 'purch'].includes(this.tab) ? `<div class="row"><input type="month" value="${this.month}" onchange="rep.month=this.value;Router.render(true)" style="width:170px"></div>` : ''}${this['t_' + this.tab]()}`;
  },
  mOrders() { return T('Orders').filter(o => VALID(o) && o.Status !== 'Cancelled' && String(o.Order_Date || '').startsWith(this.month)); },
  kv: (k, v, cls = '') => `<div class="kv"><span>${k}</span><b class="${cls}">${v}</b></div>`,
  t_sales() {
    const os = this.mOrders(); let sub = 0, disc = 0, ship = 0, tot = 0, paid = 0, rem = 0, cogs = 0, pcs = 0; const top = {};
    for (const o of os) { const t = K.orderTotals(o); sub += t.sub; disc += t.refD + t.man; ship += t.ship; tot += t.total; paid += t.paid; rem += t.rem; for (const l of t.lines) { cogs += (num(l.Unit_Cost_Stage1) || 0) * (num(l.Qty) || 0); pcs += num(l.Qty) || 0; if (l.Line_Type === 'Product') top[l.Description] = (top[l.Description] || 0) + (num(l.Qty) || 0); } }
    const oc = T('Order_Costs').filter(c => VALID(c) && os.some(o => o.Order_ID === c.Order_ID)).reduce((a, c) => a + (num(c.Total) ?? (num(c.Qty) || 0) * (num(c.Unit_Cost) || 0)), 0);
    const courier = os.reduce((a, o) => a + (num(o.Courier_Cost_Actual) || 0), 0), ex = T('Expenses').filter(e => VALID(e) && String(e.Date).startsWith(this.month)).reduce((a, e) => a + (num(e.Amount) || 0), 0);
    const gross = sub - disc - cogs - oc + (ship - courier), K_ = this.kv;
    return `<div class="card"><b class="gold">المبيعات (${os.length} أوردر · ${pcs} قطعة)</b>${K_('إجمالي الأصناف', money(sub))}${K_('الخصومات', '− ' + money(disc))}${K_('شحن وتغليف محصّل', money(ship))}${K_('الإجمالي المستحق', money(tot), 'gold')}${K_('اتحصل', money(paid), 'grn')}${K_('لسه', money(rem), 'org')}</div>
      <div class="card"><b class="gold">الربحية التقريبية</b>${K_('تكلفة المنتجات (مرحلة 1)', money(cogs))}${K_('التغليف والكروت (مرحلة 2/3)', money(oc))}${K_('شركة الشحن', money(courier))}${K_('الربح قبل المصروفات', money(gross), gross >= 0 ? 'grn' : 'red')}${K_('المصروفات', '− ' + money(ex))}${K_('الصافي التقريبي', money(gross - ex), gross - ex >= 0 ? 'grn' : 'red')}</div>
      <div class="card"><b class="gold">الأكثر مبيعًا</b>${Object.entries(top).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([k, v]) => K_(esc(k), v)).join('') || '<div class="mut">—</div>'}</div>`;
  },
  t_orders() {
    const os = this.mOrders().map(o => { const t = K.orderTotals(o), cogs = t.lines.reduce((a, l) => a + (num(l.Unit_Cost_Stage1) || 0) * (num(l.Qty) || 0), 0), oc = T('Order_Costs').filter(c => c.Order_ID === o.Order_ID && c.Record_Status === o.Record_Status).reduce((a, c) => a + (num(c.Total) ?? 0), 0); return { o, net: t.sub - t.refD - t.man + t.ship - cogs - oc - (num(o.Courier_Cost_Actual) || 0) - (num(o.COD_Fee) || 0), base: t.sub - t.refD - t.man }; }).sort((a, b) => a.net - b.net);
    return `<div class="card">${os.map(x => `<div class="kv"><a class="ltr" href="#orders?id=${x.o.Order_ID}">${esc(x.o.Order_Code)}</a><span>${esc(x.o.Customer_Name)} · <b class="${x.net >= 0 ? 'grn' : 'red'}">${money(x.net)}</b>${x.base > 0 ? ' (' + pct(x.net / x.base) + ')' : ''}</span></div>`).join('') || '<div class="mut">مفيش أوردرات الشهر ده</div>'}
      <div class="mut sm">مترتبة من الأقل ربحًا — الأحمر أوردرات بتخسر</div></div>`;
  },
  t_avail() { return `<div class="note info">التقرير ده هو نفس شاشة «المتاح / الكتالوج» — رجالي / حريمي / للجنسين، وتطلّعه واتساب أو PDF.</div><button class="btn" onclick="Router.go('catalog')">افتح المنتجات المتاحة</button>`; },
  t_stock() {
    const all = K.stockAll().filter(s => Math.abs(s.qty) > 0.0001), val = s => {
      if (s.type === 'Oil') return s.qty * (K.costPrice(s.code.slice(4)) || 0);
      if (s.type === 'Mix') { const m = K.mixes(false).find(x => x.code === s.code); return s.qty * (m ? m.perMl : 0); }
      if (s.type === 'Product') { const bo = T('Batch_Outputs').filter(o => o.SKU === s.code && VALID(o) && num(o.Unit_Cost_Stage1)).pop(); return s.qty * (bo ? num(bo.Unit_Cost_Stage1) : 0); }
      const it = K.item(s.code), p = K.itemPrice(s.code) || 0; return s.qty * (it && it.Unit === 'dozen' ? p : p);
    };
    const G = [['Product', 'منتجات'], ['Mix', 'خلطات'], ['Oil', 'زيوت'], ['Item', 'مستلزمات']], tot = all.reduce((a, s) => a + val(s), 0);
    return `<div class="card"><div class="kv tot"><span>قيمة المخزون بالتكلفة</span><span class="gold">${money(tot)} ج</span></div>${G.map(([k, l]) => this.kv(l, money(all.filter(s => s.type === k).reduce((a, s) => a + val(s), 0)) + ' ج')).join('')}</div>

  },
  t_purch() {
    const inM = d => String(d || '').startsWith(this.month), op = T('Oil_Purchases').filter(e => VALID(e) && inM(e.Date)), xp = T('Other_Purchases').filter(e => VALID(e) && inM(e.Date));
    const s = (xs, f) => xs.reduce((a, e) => a + (num(e.Total) ?? f(e)), 0), by = {};
    op.forEach(e => by[e.Supplier || '—'] = (by[e.Supplier || '—'] || 0) + (num(e.Total) ?? num(e.Qty) * num(e.Price_per_unit)));
    xp.forEach(e => by[e.Supplier || '—'] = (by[e.Supplier || '—'] || 0) + (num(e.Total) ?? num(e.Qty) * num(e.Unit_Price)));
    return `<div class="card">${this.kv('زيوت (' + op.length + ')', money(s(op, e => num(e.Qty) * num(e.Price_per_unit))))}${this.kv('مستلزمات (' + xp.length + ')', money(s(xp, e => num(e.Qty) * num(e.Unit_Price))))}</div>
      <div class="card"><b class="gold">حسب المورد</b>${Object.entries(by).sort((a, b) => b[1] - a[1]).map(([k, v]) => this.kv(esc(k), money(v))).join('') || '<div class="mut">—</div>'}</div>`;
  },
  t_due() {
    const due = T('Orders').filter(o => VALID(o) && o.Status !== 'Cancelled').map(o => ({ o, r: K.orderTotals(o).rem })).filter(x => x.r > 0.009);
    return `<div class="card"><div class="kv tot"><span>الإجمالي</span><span class="org">${money(due.reduce((a, x) => a + x.r, 0))} ج</span></div>${due.map(x => `<div class="kv"><a class="ltr" href="#orders?id=${x.o.Order_ID}">${esc(x.o.Order_Code)}</a><span>${esc(x.o.Customer_Name)} · ${esc(K.statusAR(x.o.Status))} · <b class="org">${money(x.r)}</b></span></div>`).join('') || '<div class="mut">مفيش</div>'}</div>`;
  }
};

    if (type === 'app') return field(label, `<select id="${id}">${opt('Applicable', 'أيوه', v)}${opt('Not applicable', 'لأ', v || 'Not applicable')}</select>`);
    if (type === 'supplier') return field(label, `<select id="${id}"><option value="">—</option>${K.suppliers().map(s => opt(s.Supplier_AR, s.Supplier_AR, v)).join('')}</select>`);
    if (type === 'glass') return field(label, `<select id="${id}">${T('Items').filter(i => i.Category === 'Glass' && ACTIVE(i)).map(i => opt(i.Item_ID, i.Name_AR, v)).join('')}</select>`);
    if (type === 'house') return field(label, `<select id="${id}">${T('Houses').filter(ACTIVE).map(h => opt(h.House, h.House, v)).join('')}</select>`);
    if (type === 'frag') return field(label, `<select id="${id}">${T('Fragrances').filter(ACTIVE).sort((a, b) => String(a.Name_AR).localeCompare(String(b.Name_AR), 'ar')).map(f => opt(f.Fragrance_ID, f.Name_AR + ' · ' + f.Name_EN, v)).join('')}</select>`);
    return field(label, `<input id="${id}" ${type === 'num' ? 'type="number" inputmode="decimal" step="any"' : type === 'tel' ? 'type="tel"' : ''} value="${esc(v ?? '')}">`);

  form(r, isNew) {

      <div class="grid2">${d.fields.map(([k, l, t]) => this.input(k, l, t, r[k])).join('')}</div>${!isNew && d.extra ? d.extra(r) : ''}
      <div class="grid2"><button class="btn" onclick="mas.save(${isNew})">حفظ</button><button class="btn dark" onclick="mas.id=null;mas.nw=null;Router.render(true)">رجوع</button></div></div>`;
  },
  startNew() { this.nw = Object.assign({}, MD[this.t].defaults || {}); Router.render(true); },
  async save(isNew) {
    const d = MD[this.t], vals = {};
    for (const [k, , t] of d.fields) { const el = $('#md_' + k.replace(/\W/g, '_')); if (!el) continue; vals[k] = t === 'num' ? num(el.value) : (el.value === '' ? null : el.value); }
    if (isNew) {
      if (d.newSize) {
        const v = num($('#md_Size_ml').value), cp = num($('#md_Consumer_Price').value); if (!v || !cp) return toast('اكتب الحجم وسعر المستهلك'); if (get('Size_Defaults', 'Size_ml', v)) return toast('الحجم موجود');
        const dh = C('Discount_HalfWholesale') ?? .2, dw = C('Discount_Wholesale') ?? .3, unit = $('#md_Trader_Selling_Unit').value;
        add('Size_Defaults', { Size_ml: v, Default_Glass_Item_ID: vals.Default_Glass_Item_ID, Current_Glass_Price: K.itemPrice(vals.Default_Glass_Item_ID), Active_Price_Rows: 1, Label_Item_ID: 'LB-800837', Logo: vals.Logo || 'Applicable' });
        add('Sales_Prices', { Size_ml: v, Consumer_Price: cp, HalfWholesale_Calc: Math.ceil(cp * (1 - dh)), Wholesale_Calc: Math.ceil(cp * (1 - dw)), HalfWholesale_Final: Math.ceil(cp * (1 - dh)), Wholesale_Final: Math.ceil(cp * (1 - dw)), Consumer_Min_Qty: num($('#md_Consumer_Min_Qty').value) || 1, Trader_Selling_Unit: unit, Trader_Unit_Pieces: { Dozen: 12, 'Half dozen': 6, 'Quarter dozen': 3 }[unit] });
        this.nw = null; await commit('اتضاف حجم ' + v + ' مل ✓'); return Router.render(true);
      }
      const row = Object.assign({}, d.defaults || {}, vals, { [d.key]: d.newId(), Status: vals.Status || 'Active' });
      if (this.t === 'lists') { const fr = K.frag(vals.Fragrance_ID); Object.assign(row, { Fragrance_EN: fr && fr.Name_EN, List_Owner: vals.House, Name_EN_Printed: fr && fr.Name_EN, Price_per_g: vals.Unit_Basis === 'EGP / 1 kg' ? vals.Price_Printed / 1000 : vals.Price_Printed / 1000 / (C('Oil_Density') || .9414), Source_File: 'Manual (app)', Section: 'Perfume oils', Extraction: 'Manual', Verify_Status: 'Manual', Link_Method: 'App ' + ymd(), Include_In_Stats: 'Active' }); delete row.Status; }
      if (this.t === 'suppliers' && T('Suppliers').some(s => s.Supplier_AR === vals.Supplier_AR)) return toast('المورد موجود');
      add(d.t, row); this.nw = null; await commit('اتضاف ✓'); return Router.render(true);
    }
    const r = T(d.t).find(x => String(x[d.key]) === String(this.id)), ch = {};
    for (const k in vals) if (String(r[k] ?? '') !== String(vals[k] ?? '')) ch[k] = vals[k];
    if (!Object.keys(ch).length) return toast('مفيش تغيير');
    if (this.t === 'sizes' && ch.Default_Glass_Item_ID) ch.Current_Glass_Price = K.itemPrice(ch.Default_Glass_Item_ID);
    upd(d.t, r[d.key], ch, 'Edited in app (master data)'); await commit('اتحفظ ✓'); this.id = null; Router.render(true);
  }
};

    const me = Auth.user, us = T('Users'), RL = { Owner: 'مالك', Sales: 'مبيعات', Operations: 'تشغيل' };
    const roleTxt = '<div class="mut sm"><b>مالك:</b> كل حاجة · <b>مبيعات:</b> أوردرات وعملاء وترشيح ومتاح، من غير أسعار الموردين والتكاليف والتقارير · <b>تشغيل:</b> مشتريات وتشغيلات ومخزون وعطور، من غير العملاء والتقارير والإعدادات</div>';
    return `<div class="card"><b class="gold">غيّر رقمك السري</b>${S.preview ? '<div class="note info sm">في نسخة التجربة المستخدمين مقفولين</div>' : ''}
      <div class="grid2">${field('الرقم الحالي', '<input id="pin0" type="password" inputmode="numeric">')}${field('الرقم الجديد (4–8 أرقام)', '<input id="pin1" type="password" inputmode="numeric">')}</div><button class="btn sm" onclick="set.myPin()">حفظ</button></div>
    ${isOwner() ? `<div class="card"><b class="gold">المستخدمين</b>${roleTxt}${us.map(u => `<div class="line"><div class="sp"><b>${esc(u.Name)}</b> <span class="badge">${RL[u.Role] || u.Role}</span>${u.Status !== 'Active' ? ' <span class="badge m">موقوف</span>' : ''}</div>
        <select style="width:auto;height:36px" onchange="set.role('${u.User_ID}',this.value)">${Object.entries(RL).map(([k, l]) => opt(k, l, u.Role)).join('')}</select><button class="chip" onclick="set.resetPin('${u.User_ID}')">رقم جديد</button>${me && me.User_ID === u.User_ID ? '' : `<button class="chip" onclick="set.toggle('${u.User_ID}')">${u.Status === 'Active' ? 'إيقاف' : 'تشغيل'}</button>`}</div>`).join('')}
      <div class="card" style="background:var(--bg2,#f6f3ec)"><b>الجهاز ده (${esc(S.cfg.device || '')}) من غير رقم سري</b><div class="mut sm">مناسب للابتوب اللي في مكان الشغل: البرنامج بيفتح على طول بالمستخدم ده ومن غير قفل. أي حد يقعد على الجهاز هياخد صلاحياته، فالأفضل يبقى «مبيعات» أو «تشغيل».</div>
        <select onchange="set.autoUser(this.value)">${opt('', 'لا — يطلب رقم سري (موصى بيه للموبايل)', S.cfg.autoUser || '')}${us.filter(u => u.Status === 'Active').map(u => opt(u.User_ID, 'يفتح على طول باسم ' + u.Name + ' (' + (RL[u.Role] || u.Role) + ')', S.cfg.autoUser || '')).join('')}</select></div>
      <div class="grid3">${field('الاسم', '<input id="nu_n">')}${field('الدور', `<select id="nu_r">${Object.entries(RL).map(([k, l]) => opt(k, l, 'Sales')).join('')}</select>`)}${field('رقم سري', '<input id="nu_p" type="password" inputmode="numeric">')}</div><button class="btn sm" onclick="set.addUser()">+ مستخدم</button></div>` : ''}`;
  },
  async autoUser(id) {
    if (id) { const u = get('Users', 'User_ID', id); if (u && u.Role === 'Owner' && !(await ask('الجهاز هيفتح بصلاحيات المالك من غير رقم سري — أي حد يقعد عليه هيشوف كل حاجة. متأكد؟'))) return Router.render(true); }
    S.cfg.autoUser = id || null; if (this.cfg) this.cfg.autoUser = S.cfg.autoUser; await KV.set('cfg', S.cfg); toast(id ? 'الجهاز ده هيفتح من غير رقم سري ✓' : 'الجهاز ده هيطلب رقم سري ✓'); Router.render(true);
  },
  async myPin() {
    const u = Auth.user || T('Users')[0]; if (!u) return; const a = $('#pin0').value, b = $('#pin1').value;
    if (pinHash(u.User_ID, a) !== u.PIN_Hash) return toast('الرقم الحالي غلط'); if (!/^\d{4,8}$/.test(b) || b === '0000') return toast('الرقم الجديد 4–8 أرقام ومش 0000');
    upd('Users', u.User_ID, { PIN_Hash: pinHash(u.User_ID, b) }, 'PIN changed'); await commit('اتغير الرقم السري ✓'); Router.render(true);
  },
  async addUser() { const n = $('#nu_n').value.trim(), r = $('#nu_r').value, p = $('#nu_p').value; if (!n || !/^\d{4,8}$/.test(p)) return toast('الاسم ورقم سري 4–8 أرقام'); const id = 'U' + pad(Math.max(0, ...T('Users').map(u => parseInt(String(u.User_ID).slice(1)) || 0)) + 1); add('Users', { User_ID: id, Name: n, Role: r, PIN_Hash: pinHash(id, p), Status: 'Active', Notes: null }); await commit('اتضاف ' + n + ' ✓'); Router.render(true); },
  async role(id, r) { if (Auth.user && Auth.user.User_ID === id && r !== 'Owner') return toast('مش هتقدر تشيل صلاحية المالك من نفسك'); upd('Users', id, { Role: r }, 'Role changed'); await commit('اتغير الدور ✓'); },
  async resetPin(id) { const p = await ask('الرقم السري الجديد (4–8 أرقام):', true, ''); if (!p) return; if (!/^\d{4,8}$/.test(p)) return toast('4–8 أرقام'); upd('Users', id, { PIN_Hash: pinHash(id, p) }, 'PIN reset by owner'); await commit('اتغير ✓'); },
  async toggle(id) { const u = get('Users', 'User_ID', id); upd('Users', id, { Status: u.Status === 'Active' ? 'Inactive' : 'Active' }, 'User status'); await commit('اتحفظ ✓'); Router.render(true); },
  t_const() {
    return `<div class="card"><div class="mut sm">تعديل أي رقم هنا بيتسجل في Constants وفي Change_Log.</div>
      ${T('Constants').map((r, i) => `<div class="row"><div class="sp"><div class="sm">${esc(r.Label_AR || r.Key)}</div><div class="mut sm">${esc(r.Unit || '')}</div></div><input id="k${i}" style="width:110px;height:40px" value="${esc(r.Value)}"><button class="chip" onclick="set.saveConst(${i})">حفظ</button></div>`).join('')}</div>`;
  },
  async saveConst(i) { const r = T('Constants')[i], v = $('#k' + i).value, n = num(v); upd('Constants', r.Key, { Value: n ?? v, Last_Updated: ymd() }, 'Edited in app'); await commit('اتحفظ ' + (r.Label_AR || r.Key)); },
  t_prices() {
    return `<div class="card"><div class="mut sm">سعر المستهلك ثابت في كل القنوات. نص الجملة والجملة محسوبين بالخصم والتقريب — اكتب رقم في «يدوي» لو عايز تغيّره.</div>
      <div class="tr h" style="grid-template-columns:50px 1fr 1fr 1fr 60px"><span>الحجم</span><span>مستهلك</span><span>نص جملة يدوي</span><span>جملة يدوي</span><span></span></div>
      ${T('Sales_Prices').map((r, i) => `<div class="tr" style="grid-template-columns:50px 1fr 1fr 1fr 60px"><b>${r.Size_ml}</b><input id="pc${i}" style="height:36px" value="${esc(r.Consumer_Price)}"><input id="ph${i}" style="height:36px" placeholder="${esc(r.HalfWholesale_Calc)}" value="${esc(r.HalfWholesale_Override ?? '')}"><input id="pw${i}" style="height:36px" placeholder="${esc(r.Wholesale_Calc)}" value="${esc(r.Wholesale_Override ?? '')}"><button class="chip" onclick="set.savePrice(${i})">حفظ</button></div>`).join('')}</div>`;
  },
  async savePrice(i) {
    const r = T('Sales_Prices')[i], f = { Consumer_Price: num($('#pc' + i).value), HalfWholesale_Override: num($('#ph' + i).value), Wholesale_Override: num($('#pw' + i).value) }, d = C('Discount_HalfWholesale') ?? .2, w = C('Discount_Wholesale') ?? .3;
    Object.assign(r, f, { HalfWholesale_Final: f.HalfWholesale_Override ?? Math.ceil(f.Consumer_Price * (1 - d)), Wholesale_Final: f.Wholesale_Override ?? Math.ceil(f.Consumer_Price * (1 - w)) });
    upd('Sales_Prices', r.Size_ml, f, 'Edited in app'); await commit('اتحفظ سعر ' + r.Size_ml + ' مل');
  },
  t_ship() {
    return `<div class="card"><b class="gold">شحن وتغليف لكل منطقة</b><div class="mut sm">= سعر شركة الشحن + تغليف المرحلة 3، متقرب لفوق. اكتب رقم في «يدوي» لو عايز رقم مدوّر.</div>
      ${T('Shipping_Zones').map((z, i) => `<div class="row"><div class="sp"><b>${esc(z.Zone_AR)}</b><div class="mut sm">شركة ${r2(num(z.Courier_Price))} + تغليف ${r2(num(z.Packing_Stage3))} = ${r0(num(z.Ship_Pack_Calc))}</div></div><input id="zo${i}" style="width:80px;height:40px" placeholder="${r0(num(z.Ship_Pack_Calc))}" value="${esc(z.Ship_Pack_Override ?? '')}"><button class="chip" onclick="set.saveZone(${i})">حفظ</button></div>`).join('')}</div>
    <div class="card"><b class="gold">أسعار شركة الشحن</b>${T('Courier_Rates').filter(ACTIVE).map((r, i) => `<div class="row"><div class="sp sm">${esc((get('Courier_Services', 'Service_ID', r.Service_ID) || {}).Service_AR || r.Service_ID)} · ${esc((get('Shipping_Zones', 'Zone_ID', r.Zone_ID) || {}).Zone_AR || r.Zone_ID)}</div><input id="cr${i}" style="width:80px;height:40px" value="${esc(r.Price)}"><button class="chip" onclick="set.saveRate('${r.Rate_ID}',${i})">حفظ</button></div>`).join('')}</div>
    <div class="card"><b class="gold">رسوم التحصيل (COD)</b>${T('Couriers').map((c, i) => `<div class="row"><span class="sp">${esc(c.Courier)}</span><input id="cod${i}" style="width:80px;height:40px" value="${esc(c.COD_Fee ?? '')}" placeholder="—"><button class="chip" onclick="set.saveCod('${c.Courier_ID}',${i})">حفظ</button></div>`).join('')}</div>`;
  },
  async saveZone(i) { const z = T('Shipping_Zones')[i], v = num($('#zo' + i).value); z.Ship_Pack_Charge = v ?? z.Ship_Pack_Calc; upd('Shipping_Zones', z.Zone_ID, { Ship_Pack_Override: v }, 'Edited in app'); await commit('اتحفظ'); },
  async saveRate(id, i) { upd('Courier_Rates', id, { Price: num($('#cr' + i).value), From_Date: ymd() }, 'Edited in app'); await commit('اتحفظ — الشحن والتغليف هيتحدث بعد المزامنة'); },
  async saveCod(id, i) { upd('Couriers', id, { COD_Fee: num($('#cod' + i).value) }, 'Edited in app'); await commit('اتحفظ'); },
  t_biz() {
    return `<div class="card"><div class="mut sm">البيانات دي بتظهر في الفاتورة والليبل والكتالوج.</div>${T('Business_Info').map((r, i) => `<div>${field(esc(r.Key), `<div class="row"><input id="bi${i}" value="${esc(r.Value || '')}"><button class="chip" onclick="set.saveBiz(${i})">حفظ</button></div>`)}</div>`).join('')}</div>`;
  },
  async saveBiz(i) { const r = T('Business_Info')[i]; upd('Business_Info', r.Key, { Value: $('#bi' + i).value }, 'Edited in app'); await commit('اتحفظ'); },
  t_backup() {
    return `<div class="card"><b class="gold">النسخ الاحتياطي</b><div class="sm">كل جمعة الساعة 9 الصبح تقريبًا، نسخة xlsx من الملفات التلاتة بتتحفظ في Google Drive في فولدر <b>«KandApp Backup»</b>، والنسخ الأقدم من 8 أسابيع بتتمسح لوحدها.</div>
      <button class="btn" onclick="set.backup()" ${S.preview ? 'disabled' : ''}>نسخة دلوقتي</button><div id="bk_msg" class="sm"></div>
      <div class="mut sm">لو حصل غلط في الشيت: افتح فولدر Backup، وافتح النسخة اللي قبل الغلط، وانسخ منها اللي محتاجه.</div></div>`;
  },
  async backup() { const el = $('#bk_msg'); el.textContent = 'بنعمل نسخة…'; try { const r = await Sync.call('GET', { action: 'backup' }); el.innerHTML = r.ok ? `<span class="grn">اتعملت ✓ ${esc((r.files || []).join('، '))}</span>` : `<span class="red">${esc(r.error)}</span>`; } catch (e) { el.innerHTML = `<span class="red">${esc(e.message)}</span>`; } }
};

/* Boot: load local data → seed (preview) → first-run setup; service worker */
'use strict';
async function boot() {
  try { await KV.open(); } catch (e) { document.body.innerHTML = '<p style="padding:20px">المتصفح ده مش بيسمح بالتخزين — افتح البرنامج من Chrome أو Safari عادي.</p>'; return; }
  S.preview = !!window.SEED;
  const cfg = await KV.get('cfg'); if (cfg) S.cfg = Object.assign(S.cfg, cfg);
  S.outbox = (await KV.get('outbox')) || [];
  S.lastSync = (await KV.get('lastSync')) || null;
  S.raw = await KV.get('data');
  if (window.SEED && (!S.raw || S.raw.version !== window.SEED.version)) { S.raw = window.SEED; S.outbox = []; }   // preview: refresh to the embedded snapshot
  if (!S.raw) return firstRun();
  buildT();
  if (location.hash && location.hash !== '#home') history.replaceState(null, '', location.pathname + location.search + '#home');   // every launch starts on the home page
  Router.render(false);
  if (!S.preview && S.cfg.url && S.cfg.auto) Sync.run(true);
}

function firstRun() {
  $('#app').innerHTML = `<div class="top"><div class="ttl"><b>أهلاً في KandApp</b><small>أول مرة على الجهاز ده</small></div><div class="logo">K&amp;</div></div>
  <div class="page">
    <div class="note info">البرنامج محتاج يتوصل بشيتات جوجل مرة واحدة علشان ينزّل البيانات. بعد كده يشتغل حتى من غير نت.</div>
    <div class="card">
      ${field('كود الجهاز', `<select id="fr_dev">${['W1', 'W2', 'W3', 'W4'].map(d => opt(d, d + ' — ' + { W1: 'موبايل 1', W2: 'موبايل 2', W3: 'لابتوب 1', W4: 'لابتوب 2' }[d], 'W1')).join('')}</select>`)}
      ${field('اسمك', '<input id="fr_user" placeholder="وائل">')}
      ${field('لينك الـ Web app', '<input id="fr_url" class="ltr" style="text-align:left" placeholder="https://script.google.com/macros/s/…/exec">')}
      ${field('كلمة السر', '<input id="fr_key" type="password">')}
      <button class="btn" onclick="firstConnect()">توصيل وتنزيل البيانات</button>
      <div id="fr_msg" class="sm"></div>
    </div>
  </div>`;
}
async function firstConnect() {
  const dev = $('#fr_dev').value;
  S.cfg = Object.assign(S.cfg, { device: dev, user: $('#fr_user').value, url: $('#fr_url').value.trim(), key: $('#fr_key').value, orderStart: ORDER_START[dev] });
  const m = $('#fr_msg'); m.textContent = 'بنزّل البيانات… (ممكن ياخد نص دقيقة)';
  try {
    const d = await Sync.call('GET', { action: 'pull' });
    if (!d.ok) throw new Error(d.error);
    S.raw = { version: d.version, tables: d.tables }; S.lastSync = new Date().toISOString();
    buildT(); await saveLocal(); history.replaceState(null, '', location.pathname + '#home'); Router.render(false); toast('اتوصل ✓ — البيانات نزلت');
  } catch (e) { m.innerHTML = `<span class="red">مش قادر يوصل: ${esc(e.message)}</span>`; }
}

if ('serviceWorker' in navigator && !window.SEED && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.cfg.url && S.cfg.auto && !S.preview) Sync.soon(); });
boot();

</script>
</body>
</html>
