      ${K.suppliers().map(s => `<div class="line"><div class="sp"><b>${esc(s.Supplier_AR)}</b> <span class="mut sm">${esc(s.Area || '')}</span><div class="chips" style="margin-top:4px">${K.housesOf(s.Supplier_AR).map(h => `<span class="badge m">${esc(h)}</span>`).join('')}</div></div></div>`).join('')}</div>
    <div class="card"><b class="gold">ربط مورد بشركة</b><div class="grid2">${field('المورد', `<select id="ls">${K.suppliers().map(s => opt(s.Supplier_AR, s.Supplier_AR, '')).join('')}</select>`)}${field('الشركة', `<select id="lh">${houses.map(h => opt(h, h, '')).join('')}</select>`)}</div><button class="btn sm" onclick="set.link()">ربط</button></div>
    <div class="card"><b class="gold">مورد جديد</b><div class="grid2">${field('الاسم', '<input id="ns_ar">')}${field('المكان', '<input id="ns_area">')}${field('تليفون', '<input id="ns_ph" type="tel">')}
      ${field('بيبيع', `<select id="ns_kind">${opt('Sells_Oils', 'زيوت')}${opt('Sells_Glass', 'زجاج')}${opt('Sells_Alcohol', 'كحول')}${opt('Sells_Printing', 'طباعة')}${opt('Sells_Tools', 'أدوات')}</select>`)}</div><button class="btn sm" onclick="set.addSup()">إضافة</button></div>`;
  },
  async link() { const s = $('#ls').value, h = $('#lh').value; if (K.housesOf(s).includes(h)) return toast('مربوطين قبل كده'); add('Supplier_House', { Supplier_AR: s, House: h, Source: 'App ' + ymd(), Status: 'Active' }); await commit('اتربط ✓'); Router.render(true); },
  async addSup() {
    const ar = $('#ns_ar').value.trim(); if (!ar) return toast('اكتب الاسم'); if (T('Suppliers').some(s => s.Supplier_AR === ar)) return toast('موجود');
    const kind = $('#ns_kind').value, ids = T('Suppliers').map(s => parseInt(String(s.Supplier_ID).replace(/\D/g, '')) || 0);
    const row = { Supplier_ID: 'S' + pad(Math.max(0, ...ids) + 1), Supplier_AR: ar, Supplier_EN: null, Area: $('#ns_area').value || null, Phone: $('#ns_ph').value || null, Status: 'Active', Notes: 'Added in app' };
    ['Sells_Oils', 'Sells_Glass', 'Sells_Alcohol', 'Sells_Tools', 'Sells_Printing', 'Sells_Perfumes'].forEach(k => row[k] = k === kind ? 'Applicable' : 'Not applicable');
    add('Suppliers', row); await commit('اتضاف ' + ar + ' ✓'); Router.render(true);
  },
  t_biz() {
    return `<div class="card"><div class="mut sm">البيانات دي بتظهر في الفاتورة.</div>${T('Business_Info').map((r, i) => `<div>${field(esc(r.Key), `<div class="row"><input id="bi${i}" value="${esc(r.Value || '')}"><button class="chip" onclick="set.saveBiz(${i})">حفظ</button></div>`)}</div>`).join('')}
      <div class="mut sm">باقي البيانات الأساسية (العطور، الأصناف، المنتجات والكيتات، المناطق والمحافظات، النقاط…) بتتعدل من الشيت مباشرة، والبرنامج بياخدها مع المزامنة.</div></div>`;
  },
  async saveBiz(i) { const r = T('Business_Info')[i]; upd('Business_Info', r.Key, { Value: $('#bi' + i).value }, 'Edited in app'); await commit('اتحفظ'); }
};

/* Boot: load local data → seed (preview) → first-run setup; service worker */
'use strict';
async function boot() {
  try { await KV.open(); } catch (e) { document.body.innerHTML = '<p style="padding:20px">المتصفح ده مش بيسمح بالتخزين — افتح البرنامج من Chrome أو Safari عادي.</p>'; return; }
  S.preview = !!window.SEED;
  const cfg = await KV.get('cfg'); if (cfg) S.cfg = Object.assign(S.cfg, cfg);
  S.outbox = (await KV.get('outbox')) || [];
  S.lastSync = (await KV.get('lastSync')) || null;
  S.raw = await KV.get('data');
  if (window.SEED && (!S.raw || S.raw.version !== window.SEED.version)) { S.raw = window.SEED; S.outbox = []; }   // preview: refresh to the embedded snapshot
  if (!S.raw) return firstRun();
  buildT();
  Router.render(false);
  if (!S.preview && S.cfg.url && S.cfg.auto) Sync.run(true);
}

function firstRun() {
  $('#app').innerHTML = `<div class="top"><div class="ttl"><b>أهلاً في KandApp</b><small>أول مرة على الجهاز ده</small></div><div class="logo">K&amp;</div></div>
  <div class="page">
    <div class="note info">البرنامج محتاج يتوصل بشيتات جوجل مرة واحدة علشان ينزّل البيانات. بعد كده يشتغل حتى من غير نت.</div>
    <div class="card">
      ${field('كود الجهاز', `<select id="fr_dev">${['W1', 'W2', 'W3', 'W4'].map(d => opt(d, d, 'W1')).join('')}</select>`)}
      ${field('اسمك', '<input id="fr_user" placeholder="وائل">')}
      ${field('لينك الـ Web app', '<input id="fr_url" class="ltr" style="text-align:left" placeholder="https://script.google.com/macros/s/…/exec">')}
      ${field('كلمة السر', '<input id="fr_key" type="password">')}
      <button class="btn" onclick="firstConnect()">توصيل وتنزيل البيانات</button>
      <div id="fr_msg" class="sm"></div>
    </div>
  </div>`;
}
async function firstConnect() {
  const dev = $('#fr_dev').value;
  S.cfg = Object.assign(S.cfg, { device: dev, user: $('#fr_user').value, url: $('#fr_url').value.trim(), key: $('#fr_key').value, orderStart: (+dev.slice(1) - 1) * 500 + 1 });
  const m = $('#fr_msg'); m.textContent = 'بنزّل البيانات… (ممكن ياخد نص دقيقة)';
  try {
    const d = await Sync.call('GET', { action: 'pull' });
    if (!d.ok) throw new Error(d.error);
    S.raw = { version: d.version, tables: d.tables }; S.lastSync = new Date().toISOString();
    buildT(); await saveLocal(); Router.render(false); toast('اتوصل ✓ — البيانات نزلت');
  } catch (e) { m.innerHTML = `<span class="red">مش قادر يوصل: ${esc(e.message)}</span>`; }
}

if ('serviceWorker' in navigator && !window.SEED && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.cfg.url && S.cfg.auto && !S.preview) Sync.soon(); });
boot();

</script>
</body>
</html>
